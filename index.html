<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FormTrack</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15232d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FormTrack">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+Bengali:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--steel:#22384a;--steel2:#2f4b60;--side:#15232d;--bg:#dde2e0;--paper:#fff;--ink:#17252f;--muted:#5d6f7b;--line:#b9c2bf;--line2:#d9dedc;--in:#fffbe8;--calc:#eef3f5;--accent:#0e6b8c;--accent2:#e0a526;--ph-bg:#22384a;--ph-fg:#fff;--th-bg:#2f4b60;--th-fg:#fff;--side:#15232d;--sidefg:#b8c7d0;--sideink:#fff;--sidehi:#ffffff16;--sideline:#ffffff18;--proj:#17252f;--title:#0e6b8c;--btnp-fg:#fff;--track:#d9dedc;--hi:#fff3c4;--good:#2b7a4b;--warn:#b7791f;--bad:#b23a30;--okbg:#d8efe0;--okfg:#1f5c38;--wnbg:#f8e8c4;--wnfg:#7a5211;--bdbg:#f6d5d1;--bdfg:#8a2a22;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Barlow","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
#app{display:flex;height:100%}
#side{width:220px;flex:0 0 220px;background:var(--side);color:var(--sidefg);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:14px 16px 12px;border-bottom:1px solid #ffffff18}
.brand b{display:block;font:700 21px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;color:#fff}
.brand span{font-size:11px}
.ng{font:600 11px sans-serif;letter-spacing:.08em;color:#6f8797;padding:12px 16px 3px;text-transform:uppercase}
.nl{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--sidefg);padding:7px 16px;font:500 13px inherit;font-family:inherit;cursor:pointer}
.nl:hover{background:#ffffff10;color:#fff}
.nl.on{background:#ffffff16;color:#fff;border-left-color:var(--accent2);font-weight:700}
.side-foot{margin-top:auto;padding:12px 16px;font-size:11px;border-top:1px solid #ffffff18}
#main{flex:1;min-width:0;overflow:auto;padding-block:16px 70px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin:0 0 12px}
.mh h1{margin:0;font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mh .sub{color:var(--muted);font-size:12px;margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:11px}
.panel{background:var(--paper);border:1px solid var(--line);margin-bottom:14px}
.ph{background:var(--steel);color:#fff;padding:6px 12px;font:600 15px "Barlow Condensed","Arial Narrow",sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ph small{font:500 11px sans-serif;opacity:.8}
.pb{padding:10px 12px}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));background:var(--paper);border:1px solid var(--line);margin-bottom:14px}
.k{padding:10px 14px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.k .l{font-size:11px;color:var(--muted);font-weight:600}
.k .v{font:700 24px/1.15 "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.k .s{font-size:11px;color:var(--muted)}
.k.bad .v{color:var(--bad)}.k.good .v{color:var(--good)}.k.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.grid2>.panel{margin-bottom:0}
.tw{overflow:auto;max-height:70vh}
table.sheet{border-collapse:collapse;width:100%;font-size:12px}
.sheet th{position:sticky;top:0;z-index:2;background:var(--steel2);color:#fff;font-weight:600;padding:5px 7px;border:1px solid var(--steel);text-align:left;white-space:nowrap}
.sheet td{border:1px solid var(--line2);padding:0;height:26px}
.sheet td.v,.sheet td.calc{padding:3px 7px}
.sheet td.calc{background:var(--calc);white-space:nowrap}
.sheet td.r,.sheet th.r{text-align:right}
.sheet td.sn{background:var(--calc);color:var(--muted);text-align:center;width:34px;font-size:11px}
.sheet td.x{width:26px;text-align:center}
.sheet tfoot td{background:var(--calc);font-weight:700;padding:4px 7px;border-top:2px solid var(--line)}
input.c,select.c{width:100%;height:100%;min-height:25px;border:0;background:var(--in);color:var(--ink);font:inherit;padding:3px 6px;outline:none;border-radius:0}
input.c.r{text-align:right}
input.c:focus,select.c:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--paper)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.del:hover{color:var(--bad)}
.pill{display:inline-block;padding:1px 7px;font-size:11px;font-weight:700;border-radius:2px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--okfg)}.pill.wn{background:var(--wnbg);color:var(--wnfg)}.pill.bd{background:var(--bdbg);color:var(--bdfg)}.pill.na{background:var(--calc);color:var(--muted)}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--good);font-weight:600}
.bar{height:8px;background:var(--line2);min-width:60px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar i.b{background:var(--bad)}.bar i.g{background:var(--good)}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.frm label{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.frm input,.frm select{display:block;width:100%;margin-top:2px;border:1px solid var(--line);background:var(--in);color:var(--ink);padding:5px 7px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chips select,.chips input{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 6px;font:inherit}
.chips label{font-size:11px;font-weight:600;color:var(--muted)}
.banner{background:var(--hi);border:1px solid var(--accent2);padding:8px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.alerts{margin:0;padding:0;list-style:none}
.alerts li{padding:6px 0;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--steel);color:#fff;padding:8px 14px;font-size:12px;z-index:50;display:none}
@media (max-width:820px){#app{flex-direction:column}#side{width:100%;flex:0 0 auto;flex-direction:row;overflow-x:auto;overflow-y:hidden}.brand{border:0;flex:0 0 auto}.ng,.side-foot{display:none}.nl{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.nl.on{border-bottom-color:var(--accent2)}#main{padding-block:12px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.grid2{grid-template-columns:1fr}}
@media print{html,body{height:auto;overflow:visible;background:#fff}#app{display:block}#side,.noprint,.acts,.chips,.del,.x,.banner,#toast,.btn{display:none!important}#main{overflow:visible;padding:0}.tw{max-height:none;overflow:visible}.sheet th{position:static}.ph,.pill,.sheet td.calc,.k{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4 landscape;margin:9mm}}
.muted{color:var(--muted)}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px!important;color:var(--ink)!important;font-weight:500!important;border:1px solid var(--line);background:var(--paper);padding:3px 8px;cursor:pointer}
.sub-h{margin:4px 0 6px;font:600 13px inherit;color:var(--muted)}
.sub-h:not(:first-child){margin-top:14px}
.hstep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.hstep:last-child{border-bottom:0}
.hn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.ht{font-weight:700;font-size:14px;margin-bottom:2px}
.hen{font-size:13px}
.hbn{font-size:12.5px;color:var(--muted);margin-top:3px;font-family:"Noto Sans Bengali","Nirmala UI","Vrinda",sans-serif}
.hlink{font-size:12px;font-weight:600;margin-left:6px;color:var(--accent)}
.hlist{margin:0;padding-left:18px}.hlist li{margin-bottom:8px}
.banner.demo{justify-content:flex-start}

.cfm{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.cfm-box{background:var(--paper);color:var(--ink);border:1px solid var(--line);max-width:440px;width:100%;padding:16px 18px;box-shadow:0 10px 40px #0005}
.cfm-box p{margin:0 0 14px;font-size:14px;line-height:1.5}
.cfm-box .acts{justify-content:flex-end}
.btn:focus-visible,.nl:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
/*V4*/
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.sync.ok{background:var(--okbg);color:var(--okfg)}.sync.wn{background:var(--wnbg);color:var(--wnfg)}.sync.bd{background:var(--bdbg);color:var(--bdfg)}
.paste{margin-top:10px;border:1px dashed var(--line);padding:8px 10px;background:var(--calc)}
.paste summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:12px}
.paste textarea{width:100%;margin:6px 0;padding:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:12px ui-monospace,Consolas,monospace}
.pmsg{margin-top:8px;font-size:12px;line-height:1.5}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.mgrid>.mcard{min-width:0}
.mcard{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);padding:12px 14px}
.mcard h4{margin:0 0 10px;font:700 18px "Barlow Condensed","Arial Narrow",sans-serif}
.mlist{list-style:none;margin:0;padding:0}.mlist li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}.mlist li:first-child{border-top:0}
.mlist b{display:block;font-size:13px}.mlist small{color:var(--muted);font-size:12px}
.mdot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:4px}.mdot.r{background:var(--bad)}.mdot.a{background:var(--accent2)}
.mbig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.mbig>div{background:var(--calc);padding:8px 10px}
.mbig span{display:block;font-size:11px;color:var(--muted);font-weight:600}.mbig b{display:block;font:700 28px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}.mbig small{color:var(--muted);font-size:11px}
.mrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 50px;gap:8px;align-items:center;padding:4px 0;font-size:12px}.mrow b{text-align:right}
.mok{color:var(--good);font-weight:700;margin:4px 0}
.present{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 30px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.phead b{display:block;font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif}.phead span{color:var(--muted)}
.mgrid.big{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.mgrid.big .sheet{font-size:13px}
.pfoot{margin-top:16px;font-size:11px;color:var(--muted);text-align:right}
body.presenting #app{visibility:hidden}
@media (max-width:820px){.mgrid,.mgrid.big{grid-template-columns:1fr}.mh .acts{width:100%}}
/*THEME_MULTI*/
html[data-th="classic"]{--bg:#dde2e0;--paper:#fff;--ink:#17252f;--muted:#5d6f7b;--line:#b9c2bf;--line2:#d9dedc;--in:#fffbe8;--calc:#eef3f5;--accent:#0e6b8c;--accent2:#e0a526;--ph-bg:#22384a;--ph-fg:#fff;--th-bg:#2f4b60;--th-fg:#fff;--side:#15232d;--sidefg:#b8c7d0;--sideink:#fff;--sidehi:#ffffff16;--sideline:#ffffff18;--proj:#17252f;--title:#0e6b8c;--btnp-fg:#fff;--track:#d9dedc;--hi:#fff3c4;--good:#2b7a4b;--warn:#b7791f;--bad:#b23a30;--okbg:#d8efe0;--okfg:#1f5c38;--wnbg:#f8e8c4;--wnfg:#7a5211;--bdbg:#f6d5d1;--bdfg:#8a2a22;color-scheme:light}

html[data-th="navy"]{--bg:#eef1f6;--paper:#fff;--ink:#14213d;--muted:#5b6b84;--line:#d4dbe6;--line2:#e8ecf2;--in:#fffdf6;--calc:#f3f6fa;--accent:#1f4e9c;--accent2:#f4a21c;--ph-bg:#14213d;--ph-fg:#fff;--th-bg:#e3e9f2;--th-fg:#14213d;--side:#14213d;--sidefg:#c4cde0;--sideink:#fff;--sidehi:#ffffff14;--sideline:#ffffff1a;--proj:#14213d;--title:#1f4e9c;--btnp-fg:#fff;--track:#dfe5ee;--hi:#fff4d9;--good:#2b7a4b;--warn:#b7791f;--bad:#b23a30;--okbg:#d8efe0;--okfg:#1f5c38;--wnbg:#f8e8c4;--wnfg:#7a5211;--bdbg:#f6d5d1;--bdfg:#8a2a22;color-scheme:light}
html[data-th="sand"]{--bg:#f5efe7;--paper:#fffdf9;--ink:#2b2620;--muted:#7a6f63;--line:#e2d7c9;--line2:#eee6db;--in:#fffaf2;--calc:#f8f3ec;--accent:#0f766e;--accent2:#c2410c;--ph-bg:#ece2d4;--ph-fg:#2b2620;--th-bg:#e6dac9;--th-fg:#2b2620;--side:#2b2620;--sidefg:#d8cec2;--sideink:#fff;--sidehi:#ffffff14;--sideline:#ffffff1a;--proj:#2b2620;--title:#0f766e;--btnp-fg:#fff;--track:#e6dccf;--hi:#fdf0dc;--good:#2b7a4b;--warn:#b7791f;--bad:#b23a30;--okbg:#d8efe0;--okfg:#1f5c38;--wnbg:#f8e8c4;--wnfg:#7a5211;--bdbg:#f6d5d1;--bdfg:#8a2a22;color-scheme:light}
html[data-th="mint"]{--bg:#f3faf6;--paper:#fff;--ink:#22343a;--muted:#6a7d7f;--line:#d3e8de;--line2:#e6f3ec;--in:#fff6ee;--calc:#f2f9f5;--accent:#2b9878;--accent2:#f2955f;--ph-bg:#d7f1e5;--ph-fg:#22343a;--th-bg:#c6e9d9;--th-fg:#1f3b34;--side:#e3f5ec;--sidefg:#3d5a53;--sideink:#1f3b34;--sidehi:#ffffffb3;--sideline:#d3e8de;--proj:#22343a;--title:#2b9878;--btnp-fg:#fff;--track:#dcefe5;--hi:#fff3e8;--good:#2b7a4b;--warn:#b7791f;--bad:#b23a30;--okbg:#d8efe0;--okfg:#1f5c38;--wnbg:#f8e8c4;--wnfg:#7a5211;--bdbg:#f6d5d1;--bdfg:#8a2a22;color-scheme:light}
html[data-th="softdark"]{--bg:#211d1a;--paper:#28231f;--ink:#e3dbd2;--muted:#a3978b;--line:#40382f;--line2:#322b25;--in:#302924;--calc:#2a2521;--accent:#d9a15e;--accent2:#d9a15e;--ph-bg:#2d2824;--ph-fg:#e3dbd2;--th-bg:#352f2a;--th-fg:#d8cdc1;--side:#1b1815;--sidefg:#c2b7ab;--sideink:#ece3d9;--sidehi:#ffffff0f;--sideline:#40382f;--proj:#ece3d9;--title:#d9a15e;--btnp-fg:#1b1815;--track:#3a322b;--hi:#342a1e;--good:#7fbf95;--warn:#e0b071;--bad:#e2857a;--okbg:#26382c;--okfg:#9fd4b0;--wnbg:#3d3020;--wnfg:#e8c08a;--bdbg:#432924;--bdfg:#f0a69c;color-scheme:dark}
html[data-th="black"]{--bg:#0e0e0f;--paper:#17181a;--ink:#ecebe8;--muted:#9a9ea4;--line:#2d2f33;--line2:#222427;--in:#1f2125;--calc:#1a1b1e;--accent:#e2a540;--accent2:#e2a540;--ph-bg:#1e1f22;--ph-fg:#ecebe8;--th-bg:#26282c;--th-fg:#e3e3e0;--side:#08080a;--sidefg:#b8bcc2;--sideink:#fff;--sidehi:#ffffff12;--sideline:#2d2f33;--proj:#f2f2ef;--title:#e2a540;--btnp-fg:#111;--track:#2d2f33;--hi:#2a2210;--good:#7fbf95;--warn:#e0b071;--bad:#e2857a;--okbg:#26382c;--okfg:#9fd4b0;--wnbg:#3d3020;--wnfg:#e8c08a;--bdbg:#432924;--bdfg:#f0a69c;color-scheme:dark}
body{background:var(--bg);color:var(--ink)}
#side{background:var(--side);color:var(--sidefg);border-right:1px solid var(--sideline)}
.brand{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--sideline)}
.brand .logo{flex:0 0 38px;height:38px;border-radius:9px;background:var(--accent);color:var(--btnp-fg);font:700 22px/38px "Barlow Condensed",sans-serif;text-align:center}
.brand b{color:var(--sideink);font-size:26px}.brand span{color:var(--sidefg)}
.ng{color:var(--sidefg);opacity:.65}
.nl{color:var(--sidefg)}.nl:hover{background:var(--sidehi);color:var(--sideink)}
.nl.on{background:var(--sidehi);color:var(--sideink);border-left-color:var(--accent2)}
.side-foot{border-top:1px solid var(--sideline);color:var(--sidefg)}
.company{font:600 13px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.company.empty{color:var(--muted);letter-spacing:.06em;text-transform:none;font-weight:500}
.pco{display:block;font:600 12px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.projname{font:700 38px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--proj);letter-spacing:.005em;text-wrap:balance}
.projname::after{content:"";display:block;width:64px;height:4px;border-radius:2px;margin-top:6px;background:var(--accent2)}
.mh h1{font-size:22px;color:var(--title);margin-top:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mh h1 .loc{font:500 13px Barlow,sans-serif;color:var(--muted)}
.panel{border-radius:8px;overflow:hidden;border-color:var(--line);background:var(--paper)}
.ph{background:var(--ph-bg);color:var(--ph-fg)}.ph small{color:var(--ph-fg);opacity:.75}
.sheet th{background:var(--th-bg);color:var(--th-fg);border-color:var(--line)}
.kpis{border-radius:8px;overflow:hidden;border-color:var(--line);background:var(--paper)}
.btn{border-radius:6px;background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--btnp-fg)}.btn.p:hover{color:var(--btnp-fg);filter:brightness(1.08)}
.btn.d{color:var(--bad);border-color:var(--bad);background:var(--paper)}
.banner{border-radius:8px;background:var(--hi);color:var(--ink)}
.mcard{border-radius:8px;border-top:3px solid var(--accent);background:var(--paper)}

<script>window.__FORMTRACK_PWA=true; window.__FORMTRACK_VER="2026.10.28-0938"; window.__FORMTRACK_VERNAME="28 Oct 09:38";</script>
<script>
/* FormTrack */
const STORE_KEY = 'formtrack_data_v2';
/* one-time move of data saved under the older storage name */
(()=>{ try{ const OLD='fct_v2_'+String.fromCharCode(110,105,108,101,115,104);
  const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(OLD)) keys.push(k); }
  keys.forEach(k=>{ const nk=STORE_KEY+k.slice(OLD.length); if(localStorage.getItem(nk)===null) localStorage.setItem(nk,localStorage.getItem(k)); });
  keys.forEach(k=>{ const nk=STORE_KEY+k.slice(OLD.length); if(localStorage.getItem(nk)!==null) localStorage.removeItem(k); });
}catch(e){} })();
const LEDGER_TYPES = ['Received','Dispatched','Damage claim'];
const OWNERSHIP = ['Rental','Owned'];
const NO_OUT = '(no output this period)';
const PWA = !!window.__FORMTRACK_PWA;
const FILEMODE = PWA || (()=>{ try{ return window.self===window.top; }catch(e){ return false; } })();
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const nowMs = () => Date.now();
const NOT_SPEC = '(element not entered)';

/* ---------- utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(new Date());
const thisMonth = () => todayStr().slice(0,7);
const monthOf = d => (d||'').slice(0,7);
const daysInMonth = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const addMonth = (m,k) => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+k,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const monthLabel = m => { if(!m) return '—'; const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'}); };
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const addDays = (d,k) => { const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+k); return ymd(x); };
const fmtN = (v,d=0) => num(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const cur = () => state.meta.currency || '₹';
const money = v => cur()+' '+fmtN(v,0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PILL = (cls,t) => `<span class="pill ${cls}">${t}</span>`;
const norm = s => String(s||'').trim().toLowerCase();
const FTD = window.__FT_DEFAULTS||{};
const EMBED = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
function askConfirm(msg,onYes,yesLabel){
  const old=document.getElementById('cfm'); if(old) old.remove();
  const d=document.createElement('div'); d.id='cfm'; d.className='cfm';
  d.innerHTML=`<div class="cfm-box" role="dialog" aria-modal="true"><p></p><div class="acts"><button class="btn" id="cfmNo">Cancel</button><button class="btn p" id="cfmYes"></button></div></div>`;
  d.querySelector('p').textContent=msg; d.querySelector('#cfmYes').textContent=yesLabel||'Yes, continue';
  d.querySelector('#cfmNo').onclick=()=>d.remove(); d.onclick=e=>{ if(e.target===d) d.remove(); };
  d.querySelector('#cfmYes').onclick=()=>{ d.remove(); onYes(); };
  document.body.appendChild(d); d.querySelector('#cfmYes').focus();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',3500); }

/* ---------- state ---------- */
let state;
function seed(){
  return {
    meta:{project:FTD.project||'My Project', client:'', location:FTD.location||'', user:FTD.user||'', currency:'₹', tolerance:2000, chargeDispatchDay:true, lastBackup:'', idleDays:7, carpenterWage:0, helperWage:0, stdHours:8},
    systems:[{id:'sys-conventional-ply', name:'Conventional (Ply)', ownership:'Owned', vendor:'', buyCostPerSqm:0, stdSqmPerManday:0, rentBasis:'Sqm per month', dispatchDay:'Charged'}],
    areas:[], rates:[],
    consItems:[
      {id:'ci-shuttering-oil',item:'Shuttering oil',unit:'Ltr',unitCost:0,minStock:0},
      {id:'ci-tie-cone',item:'Tie cone',unit:'Nos',unitCost:0,minStock:0},
      {id:'ci-pvc-sleeve',item:'PVC sleeve',unit:'Rmt',unitCost:0,minStock:0},
      {id:'ci-nails',item:'Nails',unit:'Kg',unitCost:0,minStock:0}],
    ledger:[], invoices:[], owned:[], usage:[], execution:[], targets:[], scope:[], labour:[], consTx:[], items:[], itemTx:[],
    storeItems:[
      {id:'si-plywood-18-mm',item:'Plywood 18 mm',kind:'Reusable',unit:'Sheets',rate:0,minStock:0},
      {id:'si-plywood-12-mm',item:'Plywood 12 mm',kind:'Reusable',unit:'Sheets',rate:0,minStock:0},
      {id:'si-runner-75x75',item:'Runner 75x75',kind:'Reusable',unit:'Rmt',rate:0,minStock:0},
      {id:'si-batten-50x75',item:'Batten 50x75',kind:'Reusable',unit:'Rmt',rate:0,minStock:0},
      {id:'si-steel-props',item:'Steel props',kind:'Reusable',unit:'Nos',rate:0,minStock:0}],
    storeTx:[], contractors:[], prpo:[], ownedTx:[], machines:[], machineTx:[], consNorms:[], manAreas:[], manSystems:[], plans:[], sysCmp:[], shifts:[], practices:[], notes:[], calcs:[], deleted:{},
    meeting:{cards:{attention:true,progress:true,cost:true,rental:true,bills:true,idle:true,delays:true,stock:false,labour:false},approved:{},locks:[],requireApproval:true},
    rev:0,
    route:'dashboard', ui:{month:thisMonth(), period:'month', groupBy:'system', sysSel:[]}
  };
}
/* Import a vendor dataset.
   Systems and areas are matched by name; rental data for those systems is replaced, everything else is kept. */
function importDataset(DS){
  const sysId={}, areaId={}, itemId={};
  DS.systems.forEach(s=>{ let x=state.systems.find(y=>norm(y.name)===norm(s.name)); if(!x){ x={id:'sys-'+slug(s.name),name:s.name,buyCostPerSqm:0,stdSqmPerManday:0}; state.systems.push(x); } Object.assign(x,{ownership:s.ownership,vendor:s.vendor||x.vendor||'',rentBasis:s.rentBasis,dispatchDay:s.dispatchDay}); sysId[s.name]=x.id; });
  DS.areas.forEach(n=>{ let a=state.areas.find(y=>norm(y.name)===norm(n)); if(!a){ a={id:'area-'+slug(n),name:n}; state.areas.push(a); } areaId[n]=a.id; });
  const ids=new Set(Object.values(sysId));
  state.ledger=state.ledger.filter(t=>!ids.has(t.systemId));
  state.items=state.items.filter(i=>!ids.has(i.systemId));
  state.itemTx=state.itemTx.filter(t=>!ids.has(t.systemId));
  state.invoices=state.invoices.filter(i=>!DS.invoices.some(d=>sysId[d.system]===i.systemId&&d.month===i.month));
  DS.rates.forEach(r=>{ const sI=sysId[r.system], aI=areaId[r.area]; let x=state.rates.find(y=>y.systemId===sI&&y.areaId===aI); if(!x){ x={id:'rate-'+sI+'-'+aI,systemId:sI,areaId:aI}; state.rates.push(x); } x.rate=r.rate; x.requiredSqm=r.requiredSqm; });
  DS.ledger.forEach((l,i)=>state.ledger.push({id:'lg-'+hashStr(JSON.stringify(l))+'-'+i,date:l.date,systemId:sysId[l.system],areaId:areaId[l.area],type:l.type,item:'',sqm:l.sqm,nos:l.nos,amount:0,challan:l.challan,remarks:l.remarks}));
  DS.items.forEach(i=>{ const id='it-'+hashStr(i.system+'|'+i.code+'|'+i.item); itemId[i.system+'|'+i.code+'|'+i.item]=id; state.items.push({id,systemId:sysId[i.system],code:i.code,item:i.item,sqmPerNo:i.sqmPerNo,kgPerNo:i.kgPerNo,boq:i.boq,ratePcDay:i.ratePcDay}); });
  DS.itemTx.forEach((t,i)=>state.itemTx.push({id:'itx-'+hashStr(JSON.stringify(t))+'-'+i,date:t.date,systemId:sysId[t.system],areaId:t.area?areaId[t.area]:'',doc:t.doc,itemId:itemId[t.system+'|'+t.code+'|'+t.item],type:t.type,nos:t.nos,remarks:''}));
  DS.invoices.forEach(i=>state.invoices.push({id:'inv-'+hashStr(i.system+'|'+i.month+'|'+i.invoiceNo),month:i.month,systemId:sysId[i.system],invoiceNo:i.invoiceNo,amount:i.amount,remarks:i.remarks}));
}
function loadVendorData(){
  if(typeof VENDOR_DATA==='undefined'){ toast('Not available here.'); return; }
  askConfirm('Load the vendor data? Rental entries, items and item movements for these 4 vendors will be replaced. Execution, scope, labour, consumables and other data are kept.',()=>{
    importDataset(VENDOR_DATA); save(); toast('Vendor data loaded: 4 systems, '+VENDOR_DATA.ledger.length+' sqm entries, '+VENDOR_DATA.itemTx.length+' item movements.'); },'Load vendor data');
}
/* STORAGE – every save goes to the device database (IndexedDB, large) and, while it fits, also to localStorage (5 MB).
   On start the newest copy wins. */
const IDBC={}; let IDBT=null, IDBQ={};
function stJSON(s){ s.savedAt=Date.now(); return JSON.stringify(s); }
function idbFlush(){ const q=IDBQ; IDBQ={}; Object.entries(q).forEach(([pid,j])=>idbSet('state:'+pid,j)); }
function idbQueue(pid,j){ IDBQ[pid]=j; IDBC[pid]=j; clearTimeout(IDBT); IDBT=setTimeout(idbFlush,150); }
try{ addEventListener('pagehide',idbFlush); document.addEventListener('visibilitychange',()=>{ if(document.hidden) idbFlush(); }); }catch(e){}
const HAS_IDB=(()=>{ try{ return !!window.indexedDB; }catch(e){ return false; } })();
function stWrite(pid,s){ const j=stJSON(s); if(HAS_IDB) idbQueue(pid,j); try{ localStorage.setItem(pkey(pid),j); return true; }catch(e){ return HAS_IDB; } }
function persist(){ if(!stWrite(PRJ.cur,state)) toast('Could not save in this browser — download a backup now.'); }
function hydrate(p){
  const s=seed(); const out=Object.assign(s,p);
  out.meta=Object.assign(seed().meta,p.meta||{});
  out.ui=Object.assign({month:thisMonth(),period:'month',groupBy:'system',sysSel:[]},p.ui||{});
  ['consItems','scope','labour','consTx','usage','targets','items','itemTx','storeItems','storeTx','contractors','prpo','ownedTx','machines','machineTx','consNorms','manAreas','manSystems','plans','sysCmp','shifts','practices','notes','calcs'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=s[k]; });
  if(!out.deleted||typeof out.deleted!=='object'||Array.isArray(out.deleted)) out.deleted={};
  if(!out.bin||typeof out.bin!=='object'||!Array.isArray(out.bin.list)) out.bin={list:[]};
  out.meeting=Object.assign(s.meeting,out.meeting||{}); ['cards','approved'].forEach(k=>{ if(!out.meeting[k]||typeof out.meeting[k]!=='object') out.meeting[k]=s.meeting[k]; }); if(!Array.isArray(out.meeting.locks)) out.meeting.locks=[];
  /* consumables kept in Store Stock (old versions) move to the one consumables list */
  { const ci=out.storeItems.filter(i=>i&&i.kind==='Consumable'); if(ci.length){ const ids=new Set(ci.map(i=>i.id)), now=Date.now();
    const nm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' '), map={};
    ci.forEach(i=>{ const same=out.consItems.find(c=>c.id!=='c-'+i.id&&nm(c.item)===nm(i.item)&&nm(c.unit)===nm(i.unit)); if(same){ map[i.id]=same.id; if(!num(same.unitCost)&&num(i.rate)){ same.unitCost=num(i.rate); same._u=now; } if(!num(same.minStock)&&num(i.minStock)){ same.minStock=num(i.minStock); same._u=now; } out.deleted[i.id]=now; return; }
      map[i.id]='c-'+i.id; const nid='c-'+i.id; if(!out.consItems.some(c=>c.id===nid)) out.consItems.push({id:nid,_u:now,item:i.item,unit:i.unit||'Nos',unitCost:num(i.rate),minStock:num(i.minStock)}); out.deleted[i.id]=now; });
    out.storeTx.filter(t=>ids.has(t.itemId)).forEach(t=>{ const nid='c-'+t.id; const ty=t.type==='Received (purchase)'||t.type==='Returned good'?'Received':'Issued';
      if(!out.consTx.some(x=>x.id===nid)) out.consTx.push({id:nid,_u:now,date:t.date,itemId:map[t.itemId],type:ty,qty:num(t.qty),systemId:'',areaId:t.areaId||'',contractorId:t.contractorId||'',doc:t.doc||'',remarks:[t.type!=='Received (purchase)'&&t.type!=='Issued to contractor'?t.type:'',t.remarks].filter(Boolean).join(' · ')}); out.deleted[t.id]=now; });
    out.storeItems=out.storeItems.filter(i=>!ids.has(i.id)); out.storeTx=out.storeTx.filter(t=>!ids.has(t.itemId)); } }
  out.systems.forEach(x=>{ if(!x.rentBasis) x.rentBasis='Sqm per month'; if(!x.dispatchDay) x.dispatchDay=out.meta.chargeDispatchDay===false?'Not charged':'Charged'; });
  return out;
}
/* an older app version wrote its built-in example name into saved data; clear it unless the user set it on purpose */
function nameHash(t){ let x=5381; for(const ch of String(t||'')) x=((x*33)^ch.charCodeAt(0))>>>0; return x; }
function oldDefaults(){
  if(FTD.project) return; const u=state.meta._u||{};
  if(!u.project && nameHash(state.meta.project)===2396310581) state.meta.project='My Project';
  if(!u.location && nameHash(state.meta.location)===3423070289) state.meta.location='';
}
function load(){
  prjRead();
  try{ const raw=localStorage.getItem(pkey(PRJ.cur)); if(raw){ state=hydrate(JSON.parse(raw)); state.meta.pid=PRJ.cur; oldDefaults(); return; } }catch(e){}
  if(PRJ.cur!==MAIN_PID){ const p=PRJ.list.find(x=>x.id===PRJ.cur); state=newProjectState(PRJ.cur,p&&p.name,p&&p.company); return; }
  state=seed(); if(PWA){ if(window.__VENDOR_BUILD) importDataset(window.__VENDOR_BUILD); state.route='storage'; state.pwaFresh=true; return; } if(typeof VENDOR_DATA!=='undefined'){ importDataset(VENDOR_DATA); state.firstRun=true; }
}

/* ---------- lookups ---------- */
const sysName = id => id==='__shared' ? 'Shared (no system)' : ((state.systems.find(s=>s.id===id)||{}).name || '—');
const sysObj = id => state.systems.find(s=>s.id===id);
const areaName = id => (state.areas.find(a=>a.id===id)||{}).name || '—';
const rentalSystems = () => state.systems.filter(s=>s.ownership==='Rental');
const ownedSystems = () => state.systems.filter(s=>s.ownership==='Owned');
const rateRow = (sId,aId) => state.rates.find(r=>r.systemId===sId && r.areaId===aId);
const consObj = id => state.consItems.find(c=>c.id===id);
const elKey = e => norm(e) || '';
const sysUnit = sId => (sysObj(sId)||{}).execUnit==='Cum'?'cum':'sqm';
const isPcs = sId => (sysObj(sId)||{}).rentBasis==='Per piece per day';
const dispCharged = sId => { const x=sysObj(sId); return x&&x.dispatchDay? x.dispatchDay!=='Not charged' : state.meta.chargeDispatchDay!==false; };
const itemObj = id => state.items.find(i=>i.id===id);

/* ---------- rental engine ---------- */
function balanceOn(sId,aId,d){
  const k=sId+'|'+aId+'|'+d; if(C.bal.has(k)) return C.bal.get(k);

    if(t.type==='Received' && t.date<=d) b+=num(t.sqm);
    else if(t.type==='Dispatched' && (dispCharged(sId) ? t.date<d : t.date<=d)) b-=num(t.sqm);

}

function addShiftFor(eid,from){ const e=state.execution.find(x=>x.id===eid); if(!e) return; state.shifts=state.shifts||[];
  state.shifts.push({id:uid(),_u:nowMs(),date:e.date,systemId:e.systemId,fromAreaId:from||'',toAreaId:e.areaId,sqm:Math.round(num(e.sqm)*100)/100,element:e.element||'',remarks:'from execution '+fmtD(e.date)});
  save(); go('ledger'); toast('Shift added – check the sqm moved (material area, not executed qty) and the date.'); }
function shiftNet(sId,aId,d){ let b=0; (state.shifts||[]).forEach(t=>{ if(t.systemId!==sId||!t.date||t.date>d) return; if(t.fromAreaId===aId) b-=num(t.sqm); if(t.toAreaId===aId) b+=num(t.sqm); }); return b; }
/* rent start: 3 options per material (system) */
const RENT_MODES=['From received date','Own date per challan','Fixed start date'];
function rentFromDate(t,sys){ const md=(sys&&sys.rentMode)||RENT_MODES[0];
  if(md==='Own date per challan') return t.rentFrom||t.date;

  return t.date; }
function rentBalOn(sId,aId,d){

    else if(t.type==='Dispatched' && (dispCharged(sId) ? t.date<d : t.date<=d)) b-=num(t.sqm);

}
function itemRentBalOn(itemId,aId,d){

  const it=itemObj(itemId), dc=it?dispCharged(it.systemId):true; let b=0;

const itemTotals = id => { let r=0,d=0,lr='',ld=''; state.itemTx.forEach(t=>{ if(t.itemId!==id) return; if(t.type==='Received'){ r+=num(t.nos); if(t.date>lr) lr=t.date; } else { d+=num(t.nos); if(t.date>ld) ld=t.date; } }); return {r,d,bal:r-d,lastR:lr,lastD:ld}; };
const ledgerAreas = sId => isPcs(sId)? [...new Set(state.itemTx.filter(t=>t.systemId===sId).map(t=>t.areaId||''))] : [...new Set(state.ledger.filter(t=>t.systemId===sId).map(t=>t.areaId).concat(state.rates.filter(r=>r.systemId===sId).map(r=>r.areaId),(state.shifts||[]).filter(t=>t.systemId===sId).flatMap(t=>[t.fromAreaId,t.toAreaId])))].filter(Boolean);
function monthRent(sId,aId,m){
  const key=sId+'|'+aId+'|'+m; if(C.rent.has(key)) return C.rent.get(key);
  if(isPcs(sId)){
    const dim=daysInMonth(m), today=todayStr(), its=state.items.filter(i=>i.systemId===sId);
    let rent=0,pcsDays=0,daysCounted=0; const byItem={};
    for(let day=1; day<=dim; day++){ const d=m+'-'+pad(day); if(d>today) break; daysCounted++;
      its.forEach(it=>{ const b=Math.max(0,itemRentBalOn(it.id,aId,d)); if(!b) return; pcsDays+=b; rent+=b*num(it.ratePcDay); const x=byItem[it.id]||(byItem[it.id]={pd:0,rent:0}); x.pd+=b; x.rent+=b*num(it.ratePcDay); }); }
    const res={rate:0,req:0,dim,daysCounted,sqmDays:0,pcsDays,peak:0,rent,excess:0,partial:daysCounted<dim,byItem,pcs:true};
    C.rent.set(key,res); return res;
  }
  const rr=rateRow(sId,aId), req=rr?num(rr.requiredSqm):0;
  let rate=rr?num(rr.rate):0; if(!rate){ const sh=(state.shifts||[]).filter(t=>t.systemId===sId&&t.toAreaId===aId).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]; const r2=sh?rateRow(sId,sh.fromAreaId):null; rate=r2?num(r2.rate):num((state.rates.find(r=>r.systemId===sId&&num(r.rate))||{}).rate); }
  const dim=daysInMonth(m), today=todayStr();
  let sqmDays=0, excessDays=0, daysCounted=0, peak=0;
  for(let day=1; day<=dim; day++){
    const d=m+'-'+pad(day); if(d>today) break;
    const b=Math.max(0,rentBalOn(sId,aId,d));
    sqmDays+=b; daysCounted++; peak=Math.max(peak,b);
    if(req>0) excessDays+=Math.max(0,b-req);
  }
  const res={rate,req,dim,daysCounted,sqmDays,peak,rent:sqmDays*rate/dim,excess:excessDays*rate/dim,partial:daysCounted<dim};
  C.rent.set(key,res); return res;
}
function systemMonthRent(sId,m){
  return ledgerAreas(sId).reduce((a,aId)=>{ const r=monthRent(sId,aId,m); a.rent+=r.rent; a.excess+=r.excess; a.sqmDays+=r.sqmDays; a.partial=a.partial||r.partial; return a; },{rent:0,excess:0,sqmDays:0,partial:false});
}
function avgRate(sId){ const rs=state.rates.filter(r=>r.systemId===sId && num(r.rate)>0); return rs.length? rs.reduce((a,r)=>a+num(r.rate),0)/rs.length : 0; }
function damageClaims(sId,m){ return state.ledger.filter(t=>t.systemId===sId && t.type==='Damage claim' && (!m||monthOf(t.date)===m)).reduce((a,t)=>a+num(t.amount),0); }
function invoiceFor(sId,m){ const v=state.invoices.filter(i=>i.systemId===sId && i.month===m); return v.length? v.reduce((a,i)=>a+num(i.amount),0) : null; }

function projectStart(){

function* dayRange(a,b){ let d=new Date(a+'T00:00:00'); const e=new Date(b+'T00:00:00'); while(d<=e){ yield ymd(d); d.setDate(d.getDate()+1); } }

/* ---------- execution ---------- */

/* ---------- labour ---------- */
const stdH = () => num(state.meta.stdHours)||8;
const mandays = rows => rows.reduce((a,r)=>a+(num(r.carpenters)+num(r.helpers))*num(r.hours===''||r.hours==null?stdH():r.hours)/stdH(),0);
const labourCost = rows => rows.reduce((a,r)=>a+(num(r.carpenters)*num(state.meta.carpenterWage)+num(r.helpers)*num(state.meta.helperWage))*num(r.hours===''||r.hours==null?stdH():r.hours)/stdH(),0);

/* ---------- consumables ---------- */
const consQty = (id,type,m) => state.consTx.filter(t=>t.itemId===id && t.type===type && (!m||monthOf(t.date)===m)).reduce((a,t)=>a+num(t.qty),0);
const CONS_TYPES=['Received','Issued','Transfer in (other site)','Transfer out (other site)','Damaged','Returned to vendor','Missing'];
const consDmgLeft = id => Math.max(0,consQty(id,'Damaged')-consQty(id,'Returned to vendor'));
/* good stock = received − issued − damaged − missing; "returned to vendor" first clears the damaged pile */
const consRecX = (id,f) => state.consTx.filter(t=>t.itemId===id&&t.type==='Received').reduce((a,t)=>a+num(t[f]),0);
const consStock = id => consStockRaw(id)+physAdj('cons',id).adj;
const consStockRaw = (id,upto) => { const Q=(ty)=>state.consTx.filter(t=>t.itemId===id&&t.type===ty&&(!upto||t.date<=upto)).reduce((a,t)=>a+num(t.qty),0), X=f=>state.consTx.filter(t=>t.itemId===id&&t.type==='Received'&&(!upto||t.date<=upto)).reduce((a,t)=>a+num(t[f]),0);
  return Q('Available on takeover')+Q('Received')-X('dmgQty')-X('shortQty')+Q('Transfer in (other site)')-Q('Transfer out (other site)')-Q('Issued')-Q('Damaged')-Q('Missing')-Math.max(0,Q('Returned to vendor')-Q('Damaged')); };
const consStockOld = id => consQty(id,'Available on takeover')+consQty(id,'Received')-consRecX(id,'dmgQty')-consRecX(id,'shortQty')+consQty(id,'Transfer in (other site)')-consQty(id,'Transfer out (other site)')-consQty(id,'Issued')-consQty(id,'Damaged')-consQty(id,'Missing')-Math.max(0,consQty(id,'Returned to vendor')-consQty(id,'Damaged'));

const ownedSqm = sId => state.owned.filter(o=>o.systemId===sId && o.unit==='Sqm').reduce((a,o)=>a+num(o.qty),0);
function ownedPerUse(o){ return (num(o.totalCost)+num(o.repairCost)-num(o.scrapValue))/Math.max(1,num(o.expectedReps)); }

  const consumed=perUse*Math.min(used,exp);

/* ---------- cost buckets: system | area | element, per month ---------- */
function monthBuckets(m){
  if(C.buckets.has(m)) return C.buckets.get(m);
  const B=new Map();
  const get=(s,a,e,label)=>{ const k=s+'|'+a+'|'+e; if(!B.has(k)) B.set(k,{s,a,ek:e,el:label||e||NOT_SPEC,rent:0,xs:0,lab:0,cons:0,own:0,sqm:0,cum:0}); return B.get(k); };
  execRows({m}).forEach(r=>{ const b=get(r.systemId,r.areaId||'',elKey(r.element),String(r.element||'').trim()); b.sqm+=num(r.sqm); b.cum+=num(r.cum); });
  const outBuckets=()=>[...B.values()].filter(b=>b.sqm>0);
  function alloc(field,amt,s,a,e){
    if(!amt) return;
    if(e!==undefined && e!==null && String(e).trim()!==''){ get(s,a||'',elKey(e),String(e).trim())[field]+=amt; return; }
    const pool=outBuckets().filter(b=>(s===null||b.s===s)&&(!a||b.a===a));
    const tot=pool.reduce((x,b)=>x+b.sqm,0);
    if(tot>0) pool.forEach(b=>b[field]+=amt*b.sqm/tot);
    else get(s===null?'__shared':s, a||'', '__noout', NO_OUT)[field]+=amt;
  }
  // rent (vendor bill if entered, else calculated) + damage claims
  rentalSystems().forEach(s=>{
    const areas=ledgerAreas(s.id), calc=areas.reduce((x,a)=>x+monthRent(s.id,a,m).rent,0);
    const inv=invoiceFor(s.id,m), f=(inv!==null && calc>0)? inv/calc : 1;
    areas.forEach(a=>{ const r=monthRent(s.id,a,m); alloc('rent',(r.rent-r.excess)*f,s.id,a); alloc('xs',r.excess*f,s.id,a); }); /* rent as per required sqm + excess above it */
    if(inv!==null && calc===0) alloc('rent',inv,s.id,null);
    alloc('rent',damageClaims(s.id,m),s.id,null);
  });
  // labour
  if(state.meta.costLab) state.labour.filter(r=>monthOf(r.date)===m).forEach(r=>alloc('lab',labourCost([r]),r.systemId||null,r.areaId,r.element));
  // consumables issued
  if(state.meta.costStore) state.consTx.filter(t=>t.type==='Issued' && monthOf(t.date)===m).forEach(t=>alloc('cons',consCostTx(t),t.systemId||null,t.areaId));
  // owned material: cost per use spread on sqm poured
  ownedSystems().forEach(s=>{ const cps=ownedCostPerSqm(s.id); if(cps) outBuckets().filter(b=>b.s===s.id).forEach(b=>b.own+=b.sqm*cps); });
  const res=[...B.values()]; C.buckets.set(m,res); return res;
}

/* ---------- repetition ---------- */
function deployedAvg(sId,aId,from,to){
  if(!from||!to||from>to) return 0;
  const areas=aId? [aId] : ledgerAreas(sId);
  let sum=0,n=0;
  for(const d of dayRange(from,to)){ let b=0; areas.forEach(a=>b+=Math.max(0,balanceOn(sId,a,d))); if(b>0){ sum+=b; n++; } }
  return n? sum/n : 0;
}
function repetitionRows(){
  const m=state.ui.month||thisMonth(), today=todayStr(), from=m+'-01', to=periodEnd(m), start=projectStart();
  const rows=[], byArea=state.ui.groupBy!=='system';
  state.systems.filter(s=>sysFilter(s.id)).forEach(s=>{

/* ---------- scope & schedule ---------- */
/* Each execution entry is linked to ONE scope line: same AREA, then same ELEMENT (or a line with no element).
   The system does not have to match – on site a different system is often used. System only breaks ties. */
function scopeAssign(){ if(C.sa) return C.sa; const M=new Map();
  state.execution.forEach(e=>{ const L=state.scope.filter(sc=>sc.areaId===e.areaId); if(!L.length) return; const ek=elKey(e.element);
    const spec=L.filter(sc=>String(sc.element||'').trim()&&elKey(sc.element)===ek), gen=L.filter(sc=>!String(sc.element||'').trim()), pool=spec.length?spec:gen; if(!pool.length) return;
    M.set(e.id,(pool.find(sc=>sc.systemId===e.systemId)||pool[0]).id); });
  return C.sa=M; }
const scopeOf = e => { const id=scopeAssign().get(e.id); return id?state.scope.find(sc=>sc.id===id):null; };
function scopeStatus(sc){
  const A=scopeAssign(), rows=state.execution.filter(e=>A.get(e.id)===sc.id).slice().sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  const scope=num(sc.scopeSqm), executed=sumSqm(rows), today=todayStr();
  const pct=scope? Math.min(1,executed/scope) : 0;
  const actualStart=rows[0]?.date||'';
  let actualFinish='', run=0; if(scope>0) for(const r of rows){ run+=num(r.sqm); if(run>=scope-1e-6){ actualFinish=r.date; break; } }
  const ps=sc.plannedStart, pf=sc.plannedFinish;
  let plannedPct=null; if(ps&&pf&&pf>=ps){ plannedPct= today<ps?0 : today>=pf?1 : (dayDiff(ps,today)+1)/(dayDiff(ps,pf)+1); }
  let status='na', label='No dates', late=0;
  if(scope>0 && actualFinish){ late=pf? Math.max(0,dayDiff(pf,actualFinish)) : 0; status=late?'wn':'ok'; label=late?`Done ${late} d late`:'Done'; }
  else if(ps && !actualStart && today>ps){ late=dayDiff(ps,today); status='bd'; label=`Start delayed ${late} d`; }
  else if(pf && today>pf){ late=dayDiff(pf,today); status='bd'; label=`Overdue ${late} d`; }
  else if(plannedPct!==null && plannedPct-pct>0.1){ status='wn'; label=`Behind plan (${fmtN((plannedPct-pct)*100)}%)`; }
  else if(actualStart){ status='ok'; label='On track'; }
  else if(ps){ status='na'; label='Not due yet'; }
  return {scope,executed,balance:Math.max(0,scope-executed),pct,actualStart,actualFinish,plannedPct,status,label,late};
}
function scopeGrouped(){
  const gb=state.ui.groupBy, G=new Map();
  state.scope.filter(sc=>sysFilter(sc.systemId)).forEach(sc=>{
    const st=scopeStatus(sc);
    const k= gb==='element'? sc.id : sc.systemId+'|'+sc.areaId;
    if(!G.has(k)) G.set(k,{s:sc.systemId,a:sc.areaId,el:String(sc.element||'').trim(),scope:0,executed:0});
    const g=G.get(k); g.scope+=st.scope; g.executed+=(st.scope?Math.min(st.executed,st.scope):0);
  });
  return [...G.values()].sort((x,y)=>sysName(x.s).localeCompare(sysName(y.s))||areaName(x.a).localeCompare(areaName(y.a))||x.el.localeCompare(y.el));
}
function targetStatus(t){
  const rows=execRows({m:t.month,a:t.areaId||undefined,s:t.systemId||undefined}), ach=sumSqm(rows), tgt=num(t.targetSqm);
  if(!tgt) return {ach,tgt,expected:0,short:0,status:'na',label:'No target'};
  const tm=thisMonth();
  if(t.month>tm) return {ach,tgt,expected:0,short:0,status:'na',label:'Future'};
  const expected= t.month<tm ? tgt : tgt*new Date().getDate()/daysInMonth(t.month);
  const short=Math.max(0,expected-ach);
  let status='ok', label= t.month<tm ? (ach>=tgt?'Achieved':'Missed') : (ach>=expected*0.9?'On track':'Behind');
  if(t.month<tm && ach<tgt) status='bd'; else if(t.month===tm && ach<expected*0.9) status='wn';
  return {ach,tgt,expected,short,status,label};
}

/* ---------- idle material ---------- */
function lastExecDate(sId,aId){ const ds=state.execution.filter(e=>e.systemId===sId&&(!aId||e.areaId===aId)).map(e=>e.date).filter(Boolean).sort(); return ds[ds.length-1]||''; }
function firstReceipt(sId,aId){ const ds=state.ledger.filter(t=>t.systemId===sId&&t.areaId===aId&&t.type==='Received').map(t=>t.date).filter(Boolean).sort(); return ds[0]||''; }
function idleList(){
  const out=[], today=todayStr(), X=num(state.meta.idleDays)||7;
  rentalSystems().forEach(s=>ledgerAreas(s.id).forEach(a=>{
    const b=balanceOn(s.id,a,today); if(b<=0.001) return;
    const rr=rateRow(s.id,a), rate=rr?num(rr.rate):0, req=rr?num(rr.requiredSqm):0;
    const reasons=[]; let idle=0;
    const scopes=state.scope.filter(sc=>sc.systemId===s.id&&sc.areaId===a);
    if(scopes.length && scopes.every(sc=>scopeStatus(sc).pct>=1)){ reasons.push('Area finished – not returned'); idle=b; }
    const last=lastExecDate(s.id,a)||firstReceipt(s.id,a); const days=last?dayDiff(last,today):0;
    if(days>=X){ reasons.push(`No work for ${days} days`); idle=b; }
    if(req>0 && b>req){ reasons.push(`${fmtN(b-req,2)} sqm above requirement`); idle=Math.max(idle,b-req); }
    if(idle>0) out.push({s,a,onSite:b,idle,reasons,rate,cost:idle*rate});
  }));
  ownedSystems().forEach(s=>{
    const q=ownedSqm(s.id); if(!q) return;
    const last=lastExecDate(s.id); const days=last?dayDiff(last,today):null;
    if(days===null||days>=X) out.push({s,a:null,onSite:q,idle:q,reasons:[days===null?'Never used':`No work for ${days} days`],rate:0,cost:0,owned:true});
  });
  return out;
}

    const mh=[['Month'],['Executed qty',1],[hasX?'Rent – as required':'Rent',1]].concat(hasX?[['Excess rent',1]]:[]).concat(state.meta.costLab?[['Labour',1]]:[]).concat(state.meta.costStore?[['Consumables',1]]:[]).concat(hasO?[['Owned mat.',1]]:[]).concat([['Total cost',1],[hasX?'Cost / unit (as required)':'Cost per unit (month)',1]]).concat(hasX?[['Incl. excess',1]]:[]).concat([['From start – qty',1],[hasX?'From start – cost / unit (as required)':'From start – cost per unit',1]]).concat(hasX?[['From start – incl. excess',1]]:[]);
    { const L=state.labour.filter(r=>num(r.carpenters)||num(r.helpers)), noWage=L.length&&!num(state.meta.carpenterWage)&&!num(state.meta.helperWage);
      const CT=state.consTx.filter(t=>t.type==='Issued'&&num(t.qty)), noRate=CT.filter(t=>!num((consObj(t.itemId)||{}).unitCost)).map(t=>(consObj(t.itemId)||{}).item).filter(Boolean);
      if((noWage&&state.meta.costLab)||(noRate.length&&state.meta.costStore)) h+=`<div class="banner">${PILL('wn','CHECK')} <span>${noWage?`Labour is entered (${fmtN(mandays(L),1)} mandays) but <b>wages are ₹0</b> – set carpenter / helper wage on <a href="#" onclick="go('labour');return false">Labour</a> so labour cost is added. `:''}${noRate.length?`Consumables issued without a rate: <b>${esc([...new Set(noRate)].join(', '))}</b> – set the rate on <a href="#" onclick="go('consumables');return false">Consumables</a>.`:''}</span></div>`; }
    /* 1d. material used where it was never booked – suggest a shift */
    if(dVis('s1d')){ const pm=periodMonths(), rows=[]; const EX=new Map(); state.execution.forEach(x=>{ const k=x.systemId+'|'+x.areaId; (EX.get(k)||EX.set(k,[]).get(k)).push(x.date); });
      const recent=(s,a,d)=>(EX.get(s+'|'+a)||[]).some(x=>x<=d&&x>=addDays(d,-14)); let more=0;

    /* 1c. excess rent – separate */

    sTot?`<tr><td>Total</td><td></td>${state.ui.groupBy==='element'?'<td></td>':''}<td class="r">${fmtN(sTot,1)}</td><td class="r">${fmtN(sDone,1)}</td><td class="r">${fmtN(sTot-sDone,1)}</td><td class="r">${fmtN(sDone/sTot*100,1)}%</td><td></td></tr>`:'')
    +(state.scope.length?'':`<p class="note" style="margin-top:6px">Enter scope on the <a href="#" onclick="go('scope');return false">Scope & Schedule</a> page.</p>`));

  // 3. Repetition

  h+=dp(['rep'],'3. Repetition (executed ÷ average material on site)', simpleTable([['System'],['Area'],[monthLabel(m)+' – avg on site sqm',1],['Executed sqm',1],['Repetitions',1],['To date – avg on site sqm',1],['Executed sqm',1],['Repetitions',1]],

    +`<p class="note hint" style="margin-top:6px">Average on site counts only days when material was on site. Owned systems use the sqm in the Owned Material register.</p>`);

function alertsHtml(){
  const out=[];
  state.rates.forEach(r=>{ const s=sysObj(r.systemId); if(s&&s.ownership==='Rental'&&!num(r.rate)&&balanceOn(r.systemId,r.areaId,todayStr())>0) out.push(['wn',`${esc(s.name)} – ${esc(areaName(r.areaId))}: material on site but rental rate not entered.`]); });
  state.invoices.forEach(i=>{ const d=invoiceDiff(i); if(!d.partial&&Math.abs(d.diff)>num(state.meta.tolerance)) out.push(['bd',`Invoice ${esc(i.invoiceNo||'')} ${esc(sysName(i.systemId))} ${monthLabel(i.month)}: ${d.diff>0?'over':'under'}-billed by ${money(Math.abs(d.diff))} (≈ ${fmtN(Math.abs(d.sqm),1)} sqm).`]); });
  state.consItems.forEach(c=>{ const s=consStock(c.id); if(s<0) out.push(['bd',`${esc(c.item)}: issued more than received (${fmtN(s,2)} ${esc(c.unit)}).`]); else if(num(c.minStock)&&s<num(c.minStock)) out.push(['wn',`${esc(c.item)}: stock ${fmtN(s,2)} ${esc(c.unit)} below minimum ${fmtN(c.minStock)}.`]); });
  state.owned.forEach(o=>{ const c=ownedCalc(o); if(c.lifeLeft<=0.1) out.push(['wn',`${esc(sysName(o.systemId))} – ${esc(o.item)}: ${c.lifeLeft<=0?'expected life used up':'under 10% life left'} (${fmtN(c.used,1)}/${c.exp} uses).`]); });
  ownedSystems().forEach(s=>{ if(state.execution.some(e=>e.systemId===s.id)&&!ownedSqm(s.id)) out.push(['wn',`${esc(s.name)}: no Sqm items in Owned Material, so its repetition and material cost can't be worked out.`]); });
  state.storeItems.forEach(i=>{ const st=storeStatus(i,storeBal(i.id)); if(st[1].startsWith('Raise PR')) out.push(['wn',`${esc(i.item)}: store stock below minimum – ${st[1]}.`]); else if(st[1]==='Check entries') out.push(['bd',`${esc(i.item)}: store figures go negative – check movements.`]); });
  state.prpo.forEach(p=>{ const st=prStatus(p); if(st[0]==='bd') out.push(['bd',`${esc(p.item||'PR '+(p.prNo||''))}: ${st[1]} (required by ${esc(p.requiredBy)}).`]); });
  usageRows(state.ui.month||thisMonth()).filter(r=>r.st[1]==='Excess'||r.st[0]==='bd').forEach(r=>out.push(['bd',`${esc(r.it.item)} – ${esc(sysName(r.sId))}: ${r.st[1]==='Excess'?`${fmtN(r.diff,0)}% above ${r.refBy} this month (${perTxt(r.rate,r.it.unit,r.u)} vs ${perTxt(r.ref,r.it.unit,r.u)})${r.extra?', '+money(r.extra)+' extra':''}`:'issued but nothing executed this month'}. <a href="#" onclick="go('consumables');return false">Check</a>`]));
  const lb=state.meta.lastBackup, days=lb?dayDiff(lb,todayStr()):null;
  if(days===null||days>=7) out.push(['wn',`Last backup: ${lb||'never'}. Download one from "Backup & Settings".`]);
  return out.length? `<ul class="alerts">${out.map(([c,t])=>`<li>${PILL(c,c==='bd'?'ACTION':'CHECK')}<span>${t}</span></li>`).join('')}</ul>` : `<p class="note">No alerts.</p>`;
}

PAGES.execution=()=>{

const USE_TOL=()=>num(state.meta.useTol)||15;
function execQty(sId,months){ return state.execution.filter(e=>e.systemId===sId&&months.includes(monthOf(e.date))).reduce((a,e)=>a+num(e.sqm),0); }
function issuedQty(sId,itemId,months){ return state.consTx.filter(t=>t.type==='Issued'&&t.systemId===sId&&t.itemId===itemId&&months.includes(monthOf(t.date))).reduce((a,t)=>a+num(t.qty),0); }
const normOf=(sId,itemId)=>state.consNorms.find(n=>n.systemId===sId&&n.itemId===itemId&&num(n.qty)&&num(n.per));
function setNorm(sId,itemId,txt){ const t=String(txt||'').trim(); let q=0,p=0; const m=t.match(/^([\d.]+)\s*(?:\/|per|in)\s*([\d.]+)$/i); if(m){ q=num(m[1]); p=num(m[2]); } else if(t){ q=num(t); p=1; }
  let n=state.consNorms.find(x=>x.systemId===sId&&x.itemId===itemId);
  if(!q||!p){ if(n){ tomb(n.id); state.consNorms=state.consNorms.filter(x=>x!==n); } }
  else { if(!n){ n={id:'norm-'+sId+'-'+itemId}; state.consNorms.push(n); } Object.assign(n,{systemId:sId,itemId,qty:q,per:p,_u:nowMs()}); }
  save(); }
function usageRows(m){
  const prev=allMonthsUpTo(m).filter(x=>x!==m), all=allMonthsUpTo(m), out=[];
  const pairs=new Set(state.consTx.filter(t=>t.type==='Issued'&&t.systemId&&all.includes(monthOf(t.date))).map(t=>t.systemId+'|'+t.itemId));
  state.consNorms.forEach(n=>pairs.add(n.systemId+'|'+n.itemId));
  pairs.forEach(k=>{ const [sId,itemId]=k.split('|'); const it=consObj(itemId); if(!it||!sysObj(sId)) return;
    const u=sysUnit(sId), ex=execQty(sId,[m]), is=issuedQty(sId,itemId,[m]);
    const pe=execQty(sId,prev), pi=issuedQty(sId,itemId,prev), te=pe+ex, ti=pi+is;
    const rate=ex?is/ex:null, avg=pe&&pi?pi/pe:null, nm=normOf(sId,itemId), std=nm?num(nm.qty)/num(nm.per):null;
    const ref=std!=null?std:avg, refBy=std!=null?'standard':(avg!=null?'your average':'');
    let diff=null, st=['na','No reference yet'];
    if(!ex&&is) st=['bd','Issued, nothing executed'];
    else if(rate!=null&&ref){ diff=(rate-ref)/ref*100; st= diff>USE_TOL()?['bd','Excess']: diff<-USE_TOL()?['na','Low – check']:['ok','Normal']; }
    else if(rate!=null&&!ref) st=['na','First month – no history'];
    const extra= diff!=null&&diff>USE_TOL() ? (rate-ref)*ex*num(it.unitCost) : 0;
    out.push({sId,itemId,it,u,ex,is,rate,avg,std,nm,ref,refBy,diff,st,extra,te,ti}); });
  return out.sort((a,b)=>sysName(a.sId).localeCompare(sysName(b.sId))||a.it.item.localeCompare(b.it.item));
}

const OWNED_TX=['Received (purchase)','Received (other site)','Dispatched (other site)','Damaged','Missing'];
const OWN_IN=/^Received/, OWN_OUT=/^(Dispatched|Damaged|Missing|Scrapped)/;
function ownedMove(id){ const r={in:0,out:0,disp:0,dmg:0,miss:0,buy:0,inv:0,sq:0}; state.ownedTx.forEach(t=>{ if(t.ownedId!==id) return; const q=num(t.qty), sq=ownSqm(t); if(OWN_IN.test(t.type)){ r.in+=q; r.sq+=sq; } if(OWN_OUT.test(t.type)){ r.out+=q; r.sq-=sq; } if(/^Dispatched/.test(t.type)) r.disp+=q; if(/^(Damaged|Scrapped)/.test(t.type)) r.dmg+=q; if(t.type==='Missing') r.miss+=q; if(t.type==='Received (purchase)'){ r.buy+=q; r.inv+=q*num(t.rate); } }); r.bal=r.in-r.out; return r; }
const ownObj=t=>state.owned.find(o=>o.id===t.ownedId)||{};
const ownUnit=t=>ownObj(t).unit||'';
const ownSqm=t=>{ const o=ownObj(t); return o.unit==='Sqm'? num(t.qty) : num(t.qty)*num(o.sqmPerNo); };
function byUnit(list,f){ const m=new Map(); list.forEach(t=>{ const u=ownUnit(t)||'—'; m.set(u,(m.get(u)||0)+f(t)); }); return m; }
const unitTxt=(m,br)=>[...m.entries()].filter(([,v])=>Math.abs(v)>1e-9).map(([u,v])=>`${fmtN(v,Math.abs(v-Math.round(v))>1e-9?2:0)} ${esc(u)}`).join(br?'<br>':' · ')||'—';

    {key:'totalCost',label:`Purchase cost (${cur()})`,type:'number',r:1},{key:'expectedReps',label:'Expected uses',type:'number',r:1},
    {key:'repairCost',label:`Repair (${cur()})`,type:'number',r:1},{key:'scrapValue',label:`Scrap value (${cur()})`,type:'number',r:1},
    {label:'Uses so far',r:1,calc:o=>fmtN(ownedCalc(o).used,1)},{label:'Cost per use',r:1,calc:o=>money(ownedCalc(o).perUse)},
    {label:'Life left',calc:o=>{const l=ownedCalc(o).lifeLeft; return bar(l,l<=0.1?'b':'g');}},{label:'Book value',r:1,calc:o=>money(ownedCalc(o).book)}],{totals:['totalCost']}),'Add each item once here – then record its movements below');
  h+=panel('Owned material – received / dispatched (each challan or invoice line)',table('ownedTx',[

    {key:'doc',label:'Challan / DC no.',w:110},{key:'invoiceNo',label:'Invoice no.',w:100},{key:'invoiceDate',label:'Invoice date',type:'date'},{key:'party',label:'Supplier / from / to',w:140},
    {key:'rate',label:`Rate (${cur()})`,type:'number',r:1},{label:`Amount (${cur()})`,r:1,money:1,noBal:1,val:t=>num(t.qty)*num(t.rate),calc:t=>num(t.rate)?money(num(t.qty)*num(t.rate)):'—'},{key:'remarks',label:'Remarks'}],
    {bal:{in:OWN_IN,out:OWN_OUT,label:'Still on site (received − dispatched − damaged − missing)'},unitOf:ownUnit}));
  /* date-wise, item-wise summary with cumulative per item (follows the filters above) */
  const TF=TBL.ownedTx, fo=tflt('ownedTx'); const showT=t=>!TF||passFlt(t,TF.cols,fo);

  const f2=x=>x?fmtN(x,Math.abs(x-Math.round(x))>1e-9?2:0):'—';
  all.forEach(t=>{ const o=ownObj(t), q=num(t.qty), sq=ownSqm(t);
    const c=C.get(t.ownedId)||{rec:0,disp:0,dmg:0,miss:0,sq:0}; C.set(t.ownedId,c);
    if(OWN_IN.test(t.type)){ c.rec+=q; c.sq+=sq; } else if(/^Dispatched/.test(t.type)){ c.disp+=q; c.sq-=sq; } else if(/^(Damaged|Scrapped)/.test(t.type)){ c.dmg+=q; c.sq-=sq; } else if(t.type==='Missing'){ c.miss+=q; c.sq-=sq; }
    if(!showT(t)) return; shownN++;
    const newDate=t.date!==lastD; lastD=t.date; const isIn=OWN_IN.test(t.type);

      <td class="calc r"><b>${f2(c.rec-c.disp-c.dmg-c.miss)} ${esc(o.unit||'')}</b></td><td class="calc r"><b>${c.sq?fmtN(c.sq,2):'—'}</b></td></tr>`); });
  h+=panel('Date-wise summary – every item, with till-date totals',(Object.keys(fo).length?`<p class="note">${PILL('wn','FILTER ON')} Showing ${shownN} of ${tx.length} lines – same filters as the table above. Till-date totals always count the item's full history.</p>`:'<p class="note hint">Left part = this entry. Right part (<b>till date</b>) = totals for that item up to and including this date.</p>')+

const MACH_TX=['Received (purchase)','Received (transfer in)','Issued to vendor','Returned from vendor','Sent for repair','Back from repair','Damaged','Transferred out'];
const machObj=id=>state.machines.find(m=>m.id===id)||{};
function machBal(id){
  const b={open:0,openV:0,buy:0,tin:0,iss:0,ret:0,rep:0,back:0,dmg:0,dmgV:0,out:0,repCost:0,buyVal:0};
  state.machineTx.forEach(t=>{ if(t.machineId!==id) return; const q=num(t.qty);
    switch(t.type){ case 'Available on takeover': b.open+=q; break; case 'Available on takeover – with vendor': b.openV+=q; b.iss+=q; break; case 'Received (purchase)': b.buy+=q-num(t.dmgQty)-num(t.shortQty); b.buyVal+=q*num(t.rate); break; case 'Returned to supplier': b.out+=q; break; case 'Received (transfer in)': b.tin+=q; break;
      case 'Issued to vendor': b.iss+=q; break; case 'Returned from vendor': b.ret+=q; break;
      case 'Sent for repair': b.rep+=q; b.repCost+=num(t.repairCost); break; case 'Back from repair': b.back+=q; b.repCost+=num(t.repairCost); break;
      case 'Damaged': if(t.contractorId) b.dmgV+=q; else b.dmg+=q; break; case 'Transferred out': b.out+=q; break; } });
  b.rec=b.buy+b.tin; b.withV=b.iss-b.ret-b.dmgV; b.inRep=b.rep-b.back; b.damaged=b.dmg+b.dmgV;
  b.store=b.open+b.rec-(b.iss-b.openV)+b.ret-b.dmg-b.inRep-b.out; b.total=b.store+b.withV+b.inRep;
  const v=num(machObj(id).unitValue); b.valStore=b.store*v; b.valTotal=b.total*v; b.valDmg=b.damaged*v; return b;
}

};

function reqSite(sId){ const s=sysObj(sId); if(!s||s.ownership!=='Rental'||isPcs(sId)) return {}; let req=0, site=0, ex=0, any=false;
  ledgerAreas(sId).forEach(a=>{ const b=Math.max(0,balanceOn(sId,a,todayStr())), rr=rateRow(sId,a), q=rr?num(rr.requiredSqm):0; if(q>0){ any=true; req+=q; site+=b; ex+=Math.max(0,b-q); } });
  return any?{req,site,ex}:{}; }
function manAutoData(){
  const am=new Map(); state.scope.forEach(sc=>{ const st=scopeStatus(sc); const k=sc.areaId||''; const g=am.get(k)||{name:areaName(sc.areaId),scope:0,done:0}; g.scope+=num(st.scope); g.done+=Math.min(num(st.executed),num(st.scope)||num(st.executed)); am.set(k,g); });
  const gm=new Map(withUI({period:'month',groupBy:'system',sysSel:[]},()=>costGrouped()).map(g=>[g.s,g]));
  const S=withUI({period:'todate',groupBy:'system',sysSel:[]},()=>costGrouped()).filter(g=>g.sqm||g.rent||g.xs).map(g=>{ const m=gm.get(g.s)||{}; return {name:sysName(g.s),unit:sysUnit(g.s)==='cum'?'Cum':'Sqm',

}

/* ================= PHOTOS (kept in this device's IndexedDB, travel inside the storage file) ================= */
const PH={};
function phPut(id,d){ PH[id]=d; idbSet('photo:'+id,d); }
function phDel(id){ delete PH[id]; idbSet('photo:'+id,null); }
async function phLoad(){ try{ const db=await idbOpen(); await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').openCursor(); q.onsuccess=e=>{ const c=e.target.result; if(!c){ res(); return; } if(String(c.key).startsWith('photo:')&&c.value) PH[String(c.key).slice(6)]=c.value; c.continue(); }; q.onerror=()=>res(); }); }catch(e){} }
function shrinkImage(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const M=1280, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.62)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function pickPhotos(id){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true; inp.onchange=async()=>{ const r=state.practices.find(x=>x.id===id); if(!r) return; r.photos=Array.isArray(r.photos)?r.photos:[];
  for(const f of [...inp.files].slice(0,6)){ try{ const d=await shrinkImage(f); const pid='ph-'+uid(); phPut(pid,d); r.photos.push(pid); }catch(e){ toast('Could not read one photo.'); } }
  r._u=nowMs(); save(); toast('Photo added'); }; inp.click(); }
function delPhoto(id,pid){ askConfirm('Remove this photo?',()=>{ const r=state.practices.find(x=>x.id===id); if(!r) return; r.photos=(r.photos||[]).filter(p=>p!==pid); binPut('@photo',[{id:'ph@'+pid,rowId:id,pid,date:r.date,title:r.title||r.observation||''}]); r._u=nowMs(); save(); },'Remove'); }
function viewPhoto(pid){ const d=document.createElement('div'); d.className='phview'; d.onclick=()=>d.remove(); d.innerHTML=`<img src="${PH[pid]||''}" alt="Photo"><span>Tap to close</span>`; document.body.appendChild(d); }
const thumbs=(r,edit)=>`<div class="thumbs">${(r.photos||[]).map(p=>PH[p]?`<span class="th"><img src="${PH[p]}" alt="" onclick="viewPhoto('${p}')">${edit?`<button title="Remove photo" onclick="delPhoto('${r.id}','${p}')">×</button>`:''}</span>`:`<span class="th miss" title="Photo is on another device – open its storage file here">📷</span>`).join('')}${edit?`<button class="addph" onclick="pickPhotos('${r.id}')">📷 Add</button>`:''}</div>`;

/* ================= NOTES & CALCULATIONS ================= */
function calcVal(expr,vals){ let e=String(expr||'').trim(); if(!e) return null; e=e.replace(/^=/,'').replace(/[×x]/g,'*').replace(/÷/g,'/').replace(/,/g,'');
  e=e.replace(/R(\d+)/gi,(m,n)=>{ const v=vals[+n-1]; return v==null||!isFinite(v)?'NaN':'('+v+')'; });
  e=e.replace(/(\d+(?:\.\d+)?)\s*%/g,'($1/100)');
  if(!/^[0-9+\-*/().\s]+$/.test(e)) return NaN;
  try{ const v=Function('"use strict";return ('+e+')')(); return typeof v==='number'?v:NaN; }catch(_){ return NaN; } }
PAGES.notes=()=>{
  const sheets=[...new Set(state.calcs.map(c=>c.sheet||'Sheet 1'))]; if(!sheets.length) sheets.push('Sheet 1');
  let cur=state.ui.calcSheet; if(!sheets.includes(cur)) cur=sheets[0];
  const rows=state.calcs.filter(c=>(c.sheet||'Sheet 1')===cur), vals=[];
  rows.forEach(r=>vals.push(calcVal(r.expr,vals)));
  let h=`<div class="chips"><label>Sheet</label>${sheets.map(x=>`<button class="btn sm ${x===cur?'p':''}" onclick="setUI('calcSheet','${esc(x).replace(/'/g,"\\\\'")}')">${esc(x)}</button>`).join('')}<button class="btn sm" onclick="newCalcSheet()">+ New sheet</button><span style="width:10px"></span><label>Rename</label><input style="min-width:180px" value="${esc(cur)}" onchange="renameCalcSheet(this.dataset.old,this.value)" data-old="${esc(cur)}" title="Type a new name and press Enter"></div>`;
  const idx=new Map(rows.map((r,i)=>[r.id,i]));
  h+=panel('Calculation – '+esc(cur),table('calcs',[{label:'Line',calc:r=>`<b>R${idx.get(r.id)+1}</b>`},{key:'desc',label:'Description',w:220},{key:'expr',label:'Calculation',w:220},{label:'= Result',r:1,calc:r=>{ const v=vals[idx.get(r.id)]; return v==null?'':(isNaN(v)?'<span class="neg">check</span>':`<b>${fmtN(v,Math.abs(v)<100&&v%1?3:2)}</b>`); }},{key:'unit',label:'Unit',w:70}],{rows,noFilter:1,noSum:1}));
  h+=panel('Notes',table('notes',[{key:'date',label:'Date',type:'date'},{key:'title',label:'Title',w:160},{key:'text',label:'Note',type:'longtext',w:420}],{rows:state.notes.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),noSum:1}));
  return h;
};
function renameCalcSheet(o,n){ n=String(n||'').trim(); if(!n||n===o) return render(); if(state.calcs.some(c=>(c.sheet||'Sheet 1')===n)){ toast('A sheet with this name already exists.'); return render(); }
  let k=0; state.calcs.forEach(c=>{ if((c.sheet||'Sheet 1')===o){ c.sheet=n; c._u=nowMs(); k++; } }); if(!k) state.calcs.push({id:uid(),_u:nowMs(),sheet:n,desc:'',expr:'',unit:''}); state.ui.calcSheet=n; save(); toast('Sheet renamed.'); }
function newCalcSheet(){ const n='Sheet '+(new Set(state.calcs.map(c=>c.sheet)).size+1); state.ui.calcSheet=n; state.calcs.push(Object.assign({id:uid(),_u:nowMs()},{sheet:n,desc:'',expr:'',unit:''})); save(); }

/* ================= FORMWORK PLANNING – plan, track delay, compare systems ================= */
const DPM=30.4;
const mAdd=(m,k)=>{ const [y,mm]=m.split('-').map(Number), t=y*12+mm-1+k; return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0'); };
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const avgWage=()=>{ const c=num(state.meta.carpenterWage), h=num(state.meta.helperWage); return c&&h?(c+h)/2:(c||h); };
function actProd(sId,aId){ const q=sumSqm(execRows({s:sId,a:aId||''})), md=mandays(state.labour.filter(r=>r.systemId===sId&&(!aId||r.areaId===aId))); return md?q/md:0; }
function actConsSqm(sId){ const q=sumSqm(execRows({s:sId})), c=state.consTx.filter(t=>t.type==='Issued'&&t.systemId===sId).reduce((a,t)=>a+consCostTx(t),0); return q?c/q:0; }
function appFigures(sId,aId){ const rr=rateRow(sId,aId)||state.rates.find(r=>r.systemId===sId&&num(r.rate)); const sy=sysObj(sId)||{};
  return {rate:rr?num(rr.rate):0, prod:Math.round((actProd(sId,aId)||actProd(sId)||num(sy.stdSqmPerManday))*100)/100, wage:Math.round(avgWage()), cons:Math.round(actConsSqm(sId)*100)/100}; }
function planDefaults(){ const sId=(rentalSystems()[0]||state.systems[0]||{}).id||'', aId=state.areas[0]?.id||''; const f=appFigures(sId,aId);
  return {name:'Plan '+(state.plans.length+1),systemId:sId,areaId:aId,start:todayStr(),scope:1000,matSqm:100,repsPerMonth:2,prod:f.prod||4,labBasis:'Daily wage',wage:f.wage||800,labRate:0,own:'Rental',rate:f.rate,buyUnit:'Sqm',buyRate:0,kgSqm:0,scrapRate:0,cons:f.cons,transport:0,workDays:26}; }
function cmpDefaults(){ const sId=(rentalSystems()[0]||state.systems[0]||{}).id||''; const f=appFigures(sId,''); const g=(state.ui.cmpGrp&&state.ui.cmpGrp!=='All')?state.ui.cmpGrp:(state.areas[0]?areaName(state.areas[0].id):'Comparison 1');
  return {grp:g,systemId:sId,own:'Rental',scope:1000,matSqm:100,repsPerMonth:2,prod:f.prod||4,labBasis:'Daily wage',wage:f.wage||800,labRate:0,rate:f.rate,buyUnit:'Sqm',buyRate:0,kgSqm:0,scrapRate:0,cons:f.cons,transport:0,other:0}; }
/* core numbers of a plan / option */
function planCalc(p){ const scope=num(p.scope), mat=num(p.matSqm), rpm=num(p.repsPerMonth), prod=num(p.prod), wd=num(p.workDays)||26;
  const buy=p.own==='Purchase', reps=mat?Math.ceil(scope/mat-1e-9):0, dur=rpm?reps/rpm:0, sqmM=mat*rpm, rentM=buy?0:mat*num(p.rate);
  const tons=mat*num(p.kgSqm)/1000, perTon=p.buyUnit==='Ton', buyT=buy?(perTon?tons*num(p.buyRate):mat*num(p.buyRate)):0, scrapT=buy?(perTon?tons*num(p.scrapRate):mat*num(p.scrapRate)):0, matNet=buyT-scrapT;
  const pieceRate=p.labBasis==='Per sqm rate';
  const rentT=rentM*dur, labT=pieceRate?scope*num(p.labRate):(prod?scope/prod*num(p.wage):0), consT=scope*num(p.cons), tr=num(p.transport)+num(p.other)*scope, total=rentT+matNet+labT+consT+tr;
  return {buy,tons,buyT,scrapT,matNet,netSqm:mat?matNet/mat:0,eqRent:mat&&dur?matNet/mat/dur:0,pieceRate,scope,mat,rpm,reps,dur,sqmM,mdM:prod?sqmM/prod:0,labDay:prod?sqmM/prod/wd:0,rentM,rentT,labT,consT,tr,total,unit:scope?total/scope:0,
    finish:p.start?addDays(p.start,Math.round(dur*DPM)):'', wd};
}
function planTrack(p,P){ const today=todayStr(); if(!p.start||!P.scope) return null;
  const el=Math.max(0,dDiff(p.start,today)), done=state.execution.filter(e=>e.systemId===p.systemId&&(!p.areaId||e.areaId===p.areaId)&&e.date>=p.start&&e.date<=today).reduce((a,e)=>a+num(e.sqm),0);
  const planned=Math.min(P.scope,P.sqmM*el/DPM), delay=Math.max(0,planned-done), ahead=Math.max(0,done-planned), dDays=P.sqmM?delay/(P.sqmM/DPM):0, rem=Math.max(0,P.scope-done), remDays=P.finish?dDiff(today,P.finish):0;
  const T={el,done,planned,delay,ahead,dDays,rem,remDays,started:el>0};
  /* A – finish on the planned date */
  if(remDays>0&&rem>0){ const needM=rem/(remDays/DPM), needRpm=P.mat?needM/P.mat:0, labDay=num(p.prod)?needM/num(p.prod)/P.wd:0, matNeed=P.rpm?needM/P.rpm:0, extraMat=Math.max(0,matNeed-P.mat), xRent=P.buy?extraMat*P.netSqm:extraMat*num(p.rate)*remDays/DPM;
    T.A={needM,needRpm,labDay,extraLab:Math.max(0,labDay-P.labDay),matNeed,extraMat,xRent,total:P.total+xRent,unit:P.scope?(P.total+xRent)/P.scope:0}; }
  /* B – continue at the planned pace */
  if(rem>0&&P.sqmM){ const days=rem/(P.sqmM/DPM), fin=addDays(today,Math.round(days)), xM=P.finish?dDiff(P.finish,fin)/DPM:0, xRent=P.rentM*xM;
    T.B={fin,xM,xRent,total:P.total+xRent,unit:P.scope?(P.total+xRent)/P.scope:0}; }
  /* C – continue at the actual pace so far */
  if(rem>0&&el>=7&&done>0){ const pace=done/(el/DPM), days=rem/(pace/DPM), fin=addDays(today,Math.round(days)), xM=P.finish?dDiff(P.finish,fin)/DPM:0, xRent=P.rentM*xM;
    T.C={pace,fin,xM,xRent,total:P.total+xRent,unit:P.scope?(P.total+xRent)/P.scope:0}; }
  return T;
}
function fillPlanFromApp(arr,id){ const r=state[arr].find(x=>x.id===id); if(!r) return; const f=appFigures(r.systemId,r.areaId||'');
  ['rate','prod','cons'].forEach(k=>{ if(f[k]) r[k]=f[k]; }); if(f.wage) r.wage=f.wage; r._u=nowMs(); save(); toast('Rent, productivity, wage and consumables filled from your site records.'); }
const mo=x=>fmtN(x,1)+' months';
const LABCOLS=()=>[{key:'labBasis',label:'Labour paid by',type:'select',options:['Daily wage','Per sqm rate'],w:120},{key:'wage',label:`Wage (${cur()}/manday)`,type:'number',r:1,na:r=>r.labBasis==='Per sqm rate',naTip:'paid per sqm'},{key:'labRate',label:`Labour rate (${cur()}/sqm)`,type:'number',r:1,na:r=>r.labBasis!=='Per sqm rate',naTip:'paid by daily wage'}];
const MATCOLS=()=>[{key:'own',label:'Rental / purchase',type:'select',options:['Rental','Purchase'],w:110},{key:'rate',label:`Rent (${cur()}/sqm/month)`,type:'number',r:1,na:r=>r.own==='Purchase',naTip:'purchased – no rent'},
  {key:'buyUnit',label:'Buy / scrap per',type:'select',options:['Sqm','Ton'],w:80,na:r=>r.own!=='Purchase',naTip:'rental – returned to vendor'},{key:'buyRate',label:`Purchase rate (${cur()})`,type:'number',r:1,na:r=>r.own!=='Purchase',naTip:'rental – returned to vendor'},{key:'kgSqm',label:'Weight (kg/sqm)',type:'number',r:1,na:r=>r.own!=='Purchase'||r.buyUnit!=='Ton',naTip:'only for purchase per ton'},{key:'scrapRate',label:`Scrap / resale (${cur()})`,type:'number',r:1,na:r=>r.own!=='Purchase',naTip:'rental – returned to vendor, no scrap value'}];
const xr=(v,xM)=>Math.abs(v)<1?'—':(v>0?`<span class="neg">+${money(v)}</span><br><small class="muted">${mo(xM)} extra rent</small>`:`<span class="ok" style="color:var(--good)">−${money(-v)}</span><br><small class="muted">${mo(-xM)} less rent</small>`);
function planView(){
  let h='';
  const L=state.plans; const sel=L.find(p=>p.id===state.ui.planSel)||L[0];
  h+=panel('Plans',table('plans',[{key:'name',label:'Plan',w:120},{key:'systemId',label:'System',type:'system',w:130},{key:'areaId',label:'Area',type:'area',w:120},{key:'start',label:'Start',type:'date'},
    {key:'scope',label:'Total qty (sqm)',type:'number',r:1},{key:'matSqm',label:'Material (sqm)',type:'number',r:1},{key:'repsPerMonth',label:'Repetitions / month',type:'number',r:1},
    {key:'prod',label:'Productivity (sqm / manday)',type:'number',r:1},...LABCOLS(),...MATCOLS(),
    {key:'cons',label:`Consumables (${cur()}/sqm)`,type:'number',r:1},{key:'transport',label:`Transport (${cur()} total)`,type:'number',r:1},{key:'workDays',label:'Working days / month',type:'number',r:1},
    {label:'Repetitions',r:1,calc:p=>fmtN(planCalc(p).reps)},{label:'Duration',r:1,calc:p=>mo(planCalc(p).dur)},{label:'Labour / day',r:1,calc:p=>fmtN(planCalc(p).labDay,1)},{label:'Unit cost',r:1,calc:p=>`<b>${money(planCalc(p).unit)}</b> <small class="muted">/sqm</small>`}],{noSum:1,noFilter:1}));
  if(!sel) return h+`<p class="note">Add a plan to see the month-wise schedule, labour, rent and delay tracking.</p>`;
  h=`<div class="chips"><label>Plan</label>${L.map(p=>`<button class="btn sm ${p.id===sel.id?'p':''}" onclick="setUI('planSel','${p.id}')">${esc(p.name||'—')}</button>`).join('')}<button class="btn sm" onclick="fillPlanFromApp('plans','${sel.id}')" title="Rent rate, productivity, wage and consumables from your actual site data">⤓ Fill from app</button></div>`+h;
  const P=planCalc(sel), T=planTrack(sel,P);
  const k=`<div class="kpis">${kpi('Repetitions',fmtN(P.reps),`${fmtN(P.mat)} sqm × ${fmtN(P.reps)} = ${fmtN(P.mat*P.reps)} sqm`)}${kpi('Duration',mo(P.dur),`${fmtN(P.rpm,1)} repetitions / month · finish ${fmtD(P.finish)}`)}${kpi('Labour needed',fmtN(P.labDay,1)+' / day',`${fmtN(P.mdM,0)} mandays / month`)}${P.buy?kpi('Material (purchase − scrap)',money(P.matNet),`buy ${money(P.buyT)} · scrap ${money(P.scrapT)}`):kpi('Rent',money(P.rentT),`${money(P.rentM)} / month`)}${kpi('Unit cost',money(P.unit)+' /sqm',money(P.total)+' total')}</div>`;
  const brk=simpleTable([['Cost head'],['Total',1],['Per sqm',1],['Share',1]],(P.buy?[['Material purchase',P.buyT],['Less scrap / resale value',-P.scrapT]]:[['Rent',P.rentT]]).concat([[P.pieceRate?'Labour (per sqm rate)':'Labour (daily wage)',P.labT],['Consumables',P.consT],['Transport',P.tr]]).map(([n,v])=>`<tr><td class="v">${n}</td><td class="calc r">${money(v)}</td><td class="calc r">${P.scope?money(v/P.scope):'—'}</td><td class="calc r">${P.total&&v>0?fmtN(v/P.total*100,0)+'%':'—'}</td></tr>`),`<tr><td>Total</td><td class="r"><b>${money(P.total)}</b></td><td class="r"><b>${money(P.unit)}</b></td><td class="r">100%</td></tr>`);
  h+=panel('Plan – '+esc(sel.name||''),k+brk);
  /* month-wise */
  const n=Math.ceil(P.dur-1e-9); const rows=[]; let cp=0, ca=0, repLeft=P.reps;
  for(let i=0;i<Math.min(n,36);i++){ const m=mAdd(monthOf(sel.start),i); const r=Math.min(P.rpm,repLeft); repLeft-=r; const q=Math.min(r*P.mat,P.scope-cp); cp+=q;
    const act=state.execution.filter(e=>e.systemId===sel.systemId&&(!sel.areaId||e.areaId===sel.areaId)&&monthOf(e.date)===m&&e.date>=sel.start).reduce((a,e)=>a+num(e.sqm),0); const past=m<=thisMonth(); if(past) ca+=act;
    rows.push(`<tr class="${m===thisMonth()?'dnew':''}"><td class="v"><b>Month ${i+1}</b> <small class="muted">${monthLabel(m)}</small></td><td class="calc r">${fmtN(r,1)}</td><td class="calc r">${fmtN(q)}</td><td class="calc r">${fmtN(cp)}</td><td class="calc r">${fmtN(num(sel.prod)?q/num(sel.prod)/P.wd:0,1)}</td><td class="calc r">${money(P.rentM*(r/(P.rpm||1)))}</td><td class="calc r tdc">${past?fmtN(act):'—'}</td><td class="calc r">${past?fmtN(ca):'—'}</td><td class="calc r">${past?`<b class="${ca<cp-1e-6?'neg':''}">${ca-cp>=0?'+':''}${fmtN(ca-cp)}</b>`:'—'}</td></tr>`); }
  h+=panel('Month-wise plan vs actual',simpleTable([['Month'],['Repetitions',1],['Planned sqm',1],['Planned – cumulative',1],['Labour / day',1],['Rent',1],['Actual sqm',1],['Actual – cumulative',1],['Ahead (+) / behind (−)',1]],rows),'actual from Execution');
  /* delay & recovery */
  if(T){ let d=`<div class="kpis">${kpi('Planned till today',fmtN(T.planned)+' sqm',`${T.el} days since start`)}${kpi('Executed till today',fmtN(T.done)+' sqm',fmtN(P.scope?T.done/P.scope*100:0,0)+'% of plan qty')}${T.delay>0.5?kpi('Behind plan',fmtN(T.delay)+' sqm',`≈ ${fmtN(T.dDays,0)} days late`,'bad'):kpi('Status',T.ahead>0.5?'Ahead '+fmtN(T.ahead)+' sqm':'On plan','', 'good')}${kpi('Balance',fmtN(T.rem)+' sqm',T.remDays>0?T.remDays+' days to planned finish':'planned finish passed',T.remDays>0?'':'bad')}</div>`;
    const opt=[];
