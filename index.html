/* ---------- STORE STOCK ---------- */
const STORE_TYPES=['Received (purchase)','Issued to contractor','Returned good','Returned damaged','Missing','Repaired','Scrapped'];
const storeObj = id => state.storeItems.find(i=>i.id===id);
const conName = id => (state.contractors.find(c=>c.id===id)||{}).name || '—';
// flow of one item: store, with contractors, damaged, missing, scrapped
function storeBal(itemId, conId){
  const b={received:0,issued:0,retGood:0,retDam:0,missing:0,repaired:0,scrapped:0};
  state.storeTx.forEach(t=>{ if(t.itemId!==itemId || (conId && t.contractorId!==conId)) return; const q=num(t.qty);
    switch(t.type){ case 'Received (purchase)': b.received+=q; break; case 'Issued to contractor': b.issued+=q; break; case 'Returned good': b.retGood+=q; break;
      case 'Returned damaged': b.retDam+=q; break; case 'Missing': b.missing+=q; break; case 'Repaired': b.repaired+=q; break; case 'Scrapped': b.scrapped+=q; break; } });
  const it=storeObj(itemId)||{}, cons=it.kind==='Consumable';
  b.withCon = cons? 0 : b.issued-b.retGood-b.retDam-b.missing;
  b.used = cons? b.issued-b.retGood : 0;
  b.inStore = b.received-b.issued+b.retGood+b.repaired;
  b.damaged = b.retDam-b.repaired-b.scrapped;
  b.total = b.inStore+b.withCon+b.damaged;
  return b;
}
const openPOQty = item => state.prpo.filter(p=>!p.receivedDate && norm(p.item)===norm(item)).reduce((a,p)=>a+num(p.qty),0);
function storeStatus(it,b){
  if(b.inStore<-1e-9||b.withCon<-1e-9||b.damaged<-1e-9) return ['bd','Check entries'];
  const min=num(it.minStock), po=openPOQty(it.item);
  if(min>0 && b.inStore+po<min) return ['bd',`Raise PR ${fmtN(min*2-b.inStore-po)} ${esc(it.unit)}`];
  if(min>0 && b.inStore<min) return ['wn','Low – PO pending'];
  return ['ok','OK'];
}
PAGES.store=()=>{
  const its=state.storeItems, B=new Map(its.map(i=>[i.id,storeBal(i.id)]));
  const val=f=>its.reduce((a,i)=>a+Math.max(0,B.get(i.id)[f])*num(i.rate),0);
  const reorder=its.filter(i=>storeStatus(i,B.get(i.id))[1].startsWith('Raise PR'));
  let h=`<p class="note">Your own formwork material (plywood, runners, props…) and store consumables. <b>Reusable</b> items are tracked out to contractors and back. <b>Consumable</b> items (nails, oil, binding wire) are used up when issued.</p>`;
  h+=`<div class="kpis">${kpi('In store',money(val('inStore')),its.length+' items')}${kpi('With contractors',money(val('withCon')),'reusable material out')}${kpi('Damaged (not repaired)',money(val('damaged')),'',val('damaged')?'warn':'')}${kpi('Missing',money(its.reduce((a,i)=>a+B.get(i.id).missing*num(i.rate),0)),'estimated value',its.some(i=>B.get(i.id).missing)?'bad':'good')}${kpi('Items to order',reorder.length,reorder.length?'raise PR':'all above minimum',reorder.length?'bad':'good')}</div>`;
  h+=panel('Stock by item',table('storeItems',[
    {key:'item',label:'Item',w:170},{key:'kind',label:'Type',type:'select',options:['Reusable','Consumable'],w:110},{key:'unit',label:'Unit',type:'select',options:['Sheets','Sqm','Rmt','Nos','Kg','Ltr','Set','Box'],w:90},
    {key:'rate',label:`Rate (${cur()}/unit)`,type:'number',r:1},{key:'minStock',label:'Min. in store',type:'number',r:1},
    {label:'In store',r:1,calc:i=>`<b>${fmtN(B.get(i.id).inStore)}</b>`},
    {label:'With contractors',r:1,calc:i=>i.kind==='Consumable'?'—':fmtN(B.get(i.id).withCon)},
    {label:'Used',r:1,calc:i=>i.kind==='Consumable'?fmtN(B.get(i.id).used):'—'},
    {label:'Damaged',r:1,calc:i=>fmtN(B.get(i.id).damaged)},{label:'Missing',r:1,calc:i=>fmtN(B.get(i.id).missing)},{label:'Scrapped',r:1,calc:i=>fmtN(B.get(i.id).scrapped)},
    {label:'Open PO',r:1,calc:i=>fmtN(openPOQty(i.item))},
    {label:'Status',calc:i=>{const [c,t]=storeStatus(i,B.get(i.id)); return PILL(c,t);}}]));
  const m=state.ui.month||thisMonth();
  const rows=state.storeTx.filter(t=>!state.ui.storeAll? monthOf(t.date)===m : true).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  h+=monthBar(`<span style="width:10px"></span><label class="ck"><input type="checkbox" ${state.ui.storeAll?'checked':''} onchange="setUI('storeAll',this.checked)"> Show all months</label>`);
  h+=panel('Store movements'+(state.ui.storeAll?'':' – '+monthLabel(m)),table('storeTx',[
    {key:'date',label:'Date',type:'date'},{key:'type',label:'Movement',type:'select',options:STORE_TYPES,w:160},{key:'itemId',label:'Item',type:'storeitem',w:170},
    {key:'qty',label:'Qty',type:'number',r:1},{key:'contractorId',label:'Contractor',type:'contractor',w:150},{key:'areaId',label:'Area',type:'area'},
    {key:'doc',label:'Challan / GRN / slip'},{key:'remarks',label:'Remarks'}],{rows,totals:['qty']}),rows.length+' entries');
  h+=`<div class="grid2">`+panel('Contractors',table('contractors',[{key:'name',label:'Contractor name',w:180},{key:'phone',label:'Phone'}]))+
     panel('How movements work',`<ul class="hlist"><li><b>Received (purchase)</b> – into the store.</li><li><b>Issued to contractor</b> – out of the store to a contractor (for consumables this means used).</li><li><b>Returned good</b> – back into the store.</li><li><b>Returned damaged</b> – back, but goes to the damaged pile.</li><li><b>Missing</b> – the contractor cannot return it.</li><li><b>Repaired</b> – damaged item fixed, back into the store.</li><li><b>Scrapped</b> – damaged item written off.</li></ul>`)+`</div>`;
  return h;
};

/* ---------- PR & PO ---------- */
function prStatus(p){
  const today=todayStr(), late=p.requiredBy && p.requiredBy<today;
  if(p.receivedDate) return ['ok','Received'];
  if(p.poDate) return [late?'bd':'wn', late?'PO – late':'PO placed'];
  if(p.prDate) return [late?'bd':'na', late?'PR – late':'PR raised'];
  return ['na','Draft'];
}
PAGES.prpo=()=>{
  const f=state.ui.prFilter||'Open';
  const open=state.prpo.filter(p=>!p.receivedDate), late=open.filter(p=>prStatus(p)[0]==='bd');
  const rows=state.prpo.filter(p=>f==='All'||(f==='Open'&&!p.receivedDate)||(f==='Late'&&prStatus(p)[0]==='bd')||(f==='Received'&&p.receivedDate)).sort((a,b)=>(a.prDate||'').localeCompare(b.prDate||''));
  const sugg=state.storeItems.filter(i=>storeStatus(i,storeBal(i.id))[1].startsWith('Raise PR'));
  const csugg=state.consItems.filter(c=>num(c.minStock)&&consStock(c.id)+openPOQty(c.item)<num(c.minStock));
  let h=`<div class="kpis">${kpi('PR waiting for PO',open.filter(p=>!p.poDate).length)}${kpi('PO waiting for delivery',open.filter(p=>p.poDate).length)}${kpi('Late',late.length,'past required date',late.length?'bad':'good')}${kpi('Open value',money(open.reduce((a,p)=>a+num(p.value),0)))}</div>`;
  if(sugg.length||csugg.length) h+=panel('Suggested – stock below minimum',simpleTable([['Item'],['In store',1],['Minimum',1],['Open PO',1],['Suggested qty',1],['']],
    sugg.map(i=>{const b=storeBal(i.id), q=num(i.minStock)*2-b.inStore-openPOQty(i.item); return `<tr><td class="v">${esc(i.item)}</td><td class="calc r">${fmtN(b.inStore)} ${esc(i.unit)}</td><td class="calc r">${fmtN(i.minStock)}</td><td class="calc r">${fmtN(openPOQty(i.item))}</td><td class="calc r"><b>${fmtN(q)}</b></td><td class="v"><button class="btn sm p" onclick="raisePR('${esc(i.item).replace(/'/g,"\\'")}',${q},'${esc(i.unit)}',${num(i.rate)},'Material')">Raise PR</button></td></tr>`;})
    .concat(csugg.map(c=>{const s=consStock(c.id), q=num(c.minStock)*2-s-openPOQty(c.item); return `<tr><td class="v">${esc(c.item)}</td><td class="calc r">${fmtN(s)} ${esc(c.unit)}</td><td class="calc r">${fmtN(c.minStock)}</td><td class="calc r">${fmtN(openPOQty(c.item))}</td><td class="calc r"><b>${fmtN(q)}</b></td><td class="v"><button class="btn sm p" onclick="raisePR('${esc(c.item).replace(/'/g,"\\'")}',${q},'${esc(c.unit)}',${num(c.unitCost)},'Consumable')">Raise PR</button></td></tr>`;}))));
  h+=`<div class="chips"><label>Show</label>${['Open','Late','Received','All'].map(x=>`<button class="btn sm ${x===f?'p':''}" onclick="setUI('prFilter','${x}')">${x}</button>`).join('')}</div>`;
  h+=panel('Purchase requests & orders',table('prpo',[{key:'category',label:'Category',type:'select',options:['Material','Consumable','Machinery','Service','Other']},{key:'item',label:'Item',w:160},{key:'qty',label:'Qty',type:'number',r:1},{key:'unit',label:'Unit'},{key:'value',label:`Value (${cur()})`,type:'number',r:1},{key:'vendor',label:'Vendor'},{key:'prNo',label:'PR no.'},{key:'prDate',label:'PR date',type:'date'},{key:'poNo',label:'PO no.'},{key:'poDate',label:'PO date',type:'date'},{key:'requiredBy',label:'Required by',type:'date'},{key:'receivedDate',label:'Received on',type:'date'},
    {label:'Status',calc:p=>{const [c,t]=prStatus(p); return PILL(c,t);}},{label:'Days open',r:1,calc:p=>p.prDate?fmtN(dayDiff(p.prDate,p.receivedDate||todayStr())):'—'},{key:'remarks',label:'Remarks'}],{rows,totals:['value']}),'showing: '+f);
  h+=`<p class="note">When material arrives, enter <b>Received on</b> here and add a <b>Received (purchase)</b> movement on Store Stock so the stock goes up.</p>`;
  return h;
};
function raisePR(item,qty,unit,rate,cat){ state.prpo.push(Object.assign({id:uid(),_u:nowMs()},DEFAULTS.prpo(),{item,qty:Math.max(0,Math.round(qty)),unit,value:Math.round(Math.max(0,qty)*rate),category:cat})); state.ui.prFilter='Open'; save(); toast('PR row added – fill PR no. and required date.'); }

/* ---------- CONTRACTOR SHEET (private) ---------- */
PAGES.contractors=()=>{
  const reus=state.storeItems.filter(i=>i.kind!=='Consumable');
  let h=`<div class="banner">${PILL('na','PRIVATE')} <span>For your record only. This page is never shown on the Meeting Screen. Estimated cost = (damaged + missing) × item rate. Nothing is charged automatically.</span></div>`;
  const rowsAll=[]; let grand=0;
  state.contractors.forEach(c=>{
    let ctot=0; const lines=[];
    reus.forEach(i=>{ const b=storeBal(i.id,c.id); if(!b.issued&&!b.retGood&&!b.retDam&&!b.missing) return; const est=(b.retDam+b.missing)*num(i.rate); ctot+=est;
      lines.push(`<tr><td class="v">${esc(i.item)}</td><td class="calc r">${fmtN(b.issued)}</td><td class="calc r">${fmtN(b.retGood)}</td><td class="calc r ${b.retDam?'neg':''}">${fmtN(b.retDam)}</td><td class="calc r ${b.missing?'neg':''}">${fmtN(b.missing)}</td><td class="calc r"><b>${fmtN(b.withCon)}</b></td><td class="calc r">${b.issued?fmtN((b.retDam+b.missing)/b.issued*100,1)+'%':'—'}</td><td class="calc r">${money(est)}</td></tr>`); });
    grand+=ctot;
    rowsAll.push(panel(esc(c.name),simpleTable([['Item'],['Taken',1],['Returned good',1],['Returned damaged',1],['Missing',1],['Still holding',1],['Damage + missing %',1],['Est. cost',1]],lines,lines.length?`<tr><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="r">${money(ctot)}</td></tr>`:''),money(ctot)+' estimated'));
  });
  h+=`<div class="kpis">${kpi('Contractors',state.contractors.length)}${kpi('Estimated damage + missing',money(grand),'all contractors',grand?'bad':'good')}</div>`;
  h+=`<div class="grid2">`+panel('1. Add your contractors',table('contractors',[{key:'name',label:'Contractor name',w:200},{key:'phone',label:'Phone'}]))+
     panel('2. Record what they take and return',`<ol class="hlist"><li>Open <a href="#" onclick="go('store');return false"><b>Store Stock</b></a> → <b>Store movements</b>.</li><li>Add a row: date, <b>Issued to contractor</b>, item, qty, contractor.</li><li>When material comes back, add <b>Returned good</b>, <b>Returned damaged</b> or <b>Missing</b> for that contractor.</li><li>This sheet fills in by itself. Rates come from <b>Rate</b> on Store Stock.</li></ol><p class="note">Have it in Excel already? Use <b>Paste rows from Excel</b> under Store movements.</p><button class="btn p sm" onclick="go('store')">Go to Store movements →</button>`)+`</div>`;

const PCOLS={}, PPRESET={ itemTx:()=>({systemId:curItemSys()}) };
const stripTags=s=>String(s||'').replace(/<[^>]+>/g,'').trim();
const byName=(list,key,raw)=>{ const r=norm(raw); const x=list.find(o=>norm(o[key])===r) || list.find(o=>norm(o[key]).startsWith(r)&&r.length>=3); return x? x.id : undefined; };
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDate(raw){
  raw=String(raw).trim(); let m;
  if(/^\d{5}(\.\d+)?$/.test(raw)){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(+raw)*86400000); return d.toISOString().slice(0,10); }
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(raw))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(raw))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  if((m=/^(\d{1,2})[-\s\/]?([A-Za-z]{3,4})[A-Za-z]*[-\s\/,]*(\d{2,4})$/.exec(raw))){ const mo=MON[m[2].toLowerCase()]; if(!mo) return undefined; const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(mo)}-${pad(+m[1])}`; }
  return undefined;
}
function parseMonth(raw){
  raw=String(raw).trim(); let m;
  if((m=/^(\d{4})[-\/](\d{1,2})$/.exec(raw))) return `${m[1]}-${pad(+m[2])}`;
  if((m=/^(\d{1,2})[-\/](\d{4})$/.exec(raw))) return `${m[2]}-${pad(+m[1])}`;
  if((m=/^([A-Za-z]{3,4})[A-Za-z]*[-\s\/,']*(\d{2,4})$/.exec(raw))){ const mo=MON[m[1].toLowerCase()]; if(!mo) return undefined; return `${m[2].length===2?'20'+m[2]:m[2]}-${pad(mo)}`; }
  const d=parseDate(raw); return d? d.slice(0,7) : undefined;
}
function parseCell(c,raw,row){
  switch(c.type){
    case 'number': { const n=parseFloat(String(raw).replace(/[,₹\s]/g,'').replace(/^\((.*)\)$/,'-$1')); return isNaN(n)?undefined:n; }
    case 'date': return parseDate(raw);
    case 'month': return parseMonth(raw);
    case 'select': return c.options.find(o=>norm(o)===norm(raw)) || c.options.find(o=>norm(o).startsWith(norm(raw))&&norm(raw).length>=3);
    case 'system': return byName(c.filter?state.systems.filter(c.filter):state.systems,'name',raw);
    case 'area': return byName(state.areas,'name',raw);
    case 'cons': return byName(state.consItems,'item',raw);
    case 'storeitem': return byName(state.storeItems,'item',raw);
    case 'contractor': return byName(state.contractors,'name',raw);
    case 'itemsel': { const its=state.items.filter(i=>i.systemId===row.systemId); const r=norm(raw); const x=its.find(i=>norm(i.code)===r)||its.find(i=>norm(i.item)===r)||its.find(i=>norm((i.code?i.code+' – ':'')+i.item)===r); return x?x.id:undefined; }
    default: return String(raw);
  }
}
function pastePanel(arr){
  const cols=(PCOLS[arr]||[]).filter(c=>!c.calc), msg=(state.ui.pasteMsg||{})[arr];
  return `<details class="paste noprint" ${msg?'open':''}><summary>Paste rows from Excel</summary>
   <p class="note">In Excel, arrange columns in this order: <b>${cols.map(c=>esc(stripTags(c.label))).join(' · ')}</b>. Select the rows, press Ctrl+C, click in the box and press Ctrl+V. A heading row is skipped automatically. Dates like 24-10-2026, 24/10/26 or 24-Oct-2026 all work; names are matched to your lists.</p>
   <textarea id="pb-${arr}" rows="4" placeholder="Paste here (Ctrl+V)"></textarea>
   <div class="acts"><button class="btn p sm" onclick="doPaste('${arr}')">Add pasted rows</button></div>
   ${msg?`<div class="pmsg">${msg}</div>`:''}</details>`;
}
function doPaste(arr){
  const box=document.getElementById('pb-'+arr), txt=(box&&box.value||'').replace(/\r/g,'');
  const cols=(PCOLS[arr]||[]).filter(c=>!c.calc);
  const lines=txt.split('\n').filter(l=>l.trim()); if(!lines.length){ toast('Paste the Excel rows into the box first.'); return; }
  let added=0; const errs=[], newRows=[];
  lines.forEach((line,li)=>{
    const cells=line.split('\t');
    if(li===0 && cells.some((v,i)=>cols[i]&&norm(v)===norm(stripTags(cols[i].label)))) return;
    const row=Object.assign({id:uid()},DEFAULTS[arr](),PPRESET[arr]?PPRESET[arr]():{}); let bad=null;
    cols.forEach((c,i)=>{ if(bad) return; const raw=(cells[i]??'').trim(); if(raw==='') return; const v=parseCell(c,raw,row); if(v===undefined) bad=`Line ${li+1}: "${esc(raw)}" not recognised as ${esc(stripTags(c.label))}`; else row[c.key]=v; });
    if(bad) errs.push(bad); else { newRows.push(row); added++; }
  });
  newRows.forEach(r=>r._u=nowMs()); state[arr].push(...newRows);
  state.ui.pasteMsg=state.ui.pasteMsg||{};
  state.ui.pasteMsg[arr]=`<b>${added} row${added===1?'':'s'} added.</b>${errs.length?` ${errs.length} skipped:<br>`+errs.slice(0,8).join('<br>')+(errs.length>8?'<br>…':'')+'<br>Fix those lines in Excel and paste them again.':''}`;
  save(); toast(`${added} row${added===1?'':'s'} added${errs.length?', '+errs.length+' skipped':''}.`);
}

function persistLocal(){ try{ localStorage.setItem(pkey(PRJ.cur), JSON.stringify(state)); }catch(e){} }
function schedulePush(){ if(!SYNC.db) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(pushRemote,700); }
function chunkArray(arr){ const out=[]; let cur=[],size=2; for(const r of arr){ const s=JSON.stringify(r).length+1; if(cur.length&&size+s>180000){ out.push(cur); cur=[]; size=2; } cur.push(r); size+=s; } out.push(cur); return out; }
async function pushRemote(){
  if(!SYNC.db) return; if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; setSync('saving');
  try{
    const small={}, chunks={};
    for(const k of Object.keys(state)){
      if(k==='pending'||k==='firstRun') continue;
      if(Array.isArray(state[k])){
        const cs=chunkArray(state[k]); chunks[k]=cs.length;
        for(let i=0;i<cs.length;i++){ const id=k+'~'+i, js=JSON.stringify(cs[i]); if(SYNC.written[id]===js) continue; await SYNC.db.doc(syncCol()+'/'+id).set({rows:cs[i]}); SYNC.written[id]=js; }
        for(let i=cs.length;i<(SYNC.chunks[k]||0);i++){ await SYNC.db.doc(syncCol()+'/'+k+'~'+i).delete(); delete SYNC.written[k+'~'+i]; }
      } else small[k]=state[k];
    }
    await SYNC.db.doc(syncCol()+'/_meta').set({rev:state.rev||0,savedAt:new Date().toISOString(),chunks,small:JSON.parse(JSON.stringify(small))});
    SYNC.chunks=chunks; state.pending=false; SYNC.waiting=0; SYNC.last=new Date().toTimeString().slice(0,5); persistLocal(); setSync('saved');
  }catch(e){
    console.warn('sync failed',e); setSync('error');
    if(e&&e.code==='quota_exceeded') toast('Online storage is full. Download Excel and a backup, then ask for help to archive old data.');
    clearTimeout(SYNC.retry); SYNC.retry=setTimeout(pushRemote,20000);
  }finally{ SYNC.busy=false; if(SYNC.again){ SYNC.again=false; schedulePush(); } }
}
async function pullRemote(m){
  const snap=await SYNC.db.collection(syncCol()).get(); const docs={}; snap.docs.forEach(d=>{ docs[d.id]=d.data(); });
  const next=Object.assign({},m.small||{});
  for(const [k,n] of Object.entries(m.chunks||{})){ let rows=[]; for(let i=0;i<n;i++){ const d=docs[k+'~'+i]; const r=d&&Array.isArray(d.rows)?d.rows:[]; rows=rows.concat(r); SYNC.written[k+'~'+i]=JSON.stringify(r); } next[k]=rows; }
  const ui=state.ui, route=state.route;
  state=hydrate(next); state.ui=Object.assign(state.ui,ui); state.route=route; state.rev=m.rev||0; state.meta.pid=PRJ.cur; state.pending=false;
  SYNC.chunks=m.chunks||{}; SYNC.last=new Date().toTimeString().slice(0,5);
  clearCaches(); persistLocal(); render(); setSync('saved');
}
async function initSync(){
  if(!(window.claude && typeof window.claude.use==='function')){ setSync('local'); return; }
  let db=null; try{ db=await window.claude.use('db'); }catch(e){}
  if(!db){ setSync(EMBED?'nodb':'local'); return; }
  SYNC.db=db; await prjPullRemote(); prjPushRemote(true); await syncAttach(); render();
}
async function syncAttach(){
  const db=SYNC.db; if(!db) return;
  if(SYNC.unsub){ try{ SYNC.unsub(); }catch(e){} SYNC.unsub=null; }
  SYNC.written={}; SYNC.chunks={}; setSync('loading');
  const col=syncCol();
  try{
    const ms=await db.doc(col+'/_meta').get();
    if(col!==syncCol()) return;
    if(ms.exists){ const m=ms.data(); SYNC.chunks=m.chunks||{}; if(state.pending && (state.rev||0)>(m.rev||0)) await pushRemote(); else await pullRemote(m); }
    else await pushRemote();
    SYNC.unsub=db.doc(col+'/_meta').onSnapshot(s=>{ if(col!==syncCol()||!s.exists||s.metadata.hasPendingWrites) return; const m=s.data(); if((m.rev||0)>(state.rev||0)&&!state.pending&&!SYNC.busy) pullRemote(m).catch(()=>{}); },()=>{});
  }catch(e){ console.warn(e); setSync('error'); clearTimeout(SYNC.retry); SYNC.retry=setTimeout(()=>{ if(state.pending) pushRemote(); },20000); }
}

/* ---- tiny IndexedDB for the file handle (laptop) ---- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('formtrack',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idbOpen(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

/* ---- export / merge ---- */
function exportState(){
  const out={}; Object.keys(state).forEach(k=>{ if(['ui','route','pending','firstRun','pwaFresh'].includes(k)) return; out[k]=state[k]; });
  return {format:'formtrack',version:1,savedAt:new Date().toISOString(),savedBy:navigator.userAgent.slice(0,60),state:out};
}
function mergeState(raw){
  const inc0 = raw && raw.format==='formtrack' ? raw.state : raw;
  if(!inc0 || !Array.isArray(inc0.systems)) throw new Error('not a FormTrack file');
  const I=hydrate(JSON.parse(JSON.stringify(inc0)));
  let added=0, updated=0, removed=0;
  const del=Object.assign({},state.deleted||{}); Object.entries(I.deleted||{}).forEach(([id,t])=>{ del[id]=Math.max(del[id]||0,t); });
  const keys=new Set([...Object.keys(state),...Object.keys(I)]);
  keys.forEach(k=>{
    if(!Array.isArray(I[k]) && !Array.isArray(state[k])) return;
    const mine=Array.isArray(state[k])?state[k]:[], theirs=Array.isArray(I[k])?I[k]:[];
    const map=new Map(mine.map(r=>[r.id,r]));
    theirs.forEach(r=>{ if(!r||!r.id) return; const m=map.get(r.id); if(!m){ if(!(del[r.id] && del[r.id]>=(r._u||0))){ map.set(r.id,r); added++; } } else if((r._u||0)>(m._u||0)){ map.set(r.id,r); updated++; } });
    const before=map.size; const list=[...map.values()].filter(r=>!(r&&r.id&&del[r.id]&&del[r.id]>=(r._u||0)));
    removed+=before-list.length; state[k]=list;
  });
  const mu=state.meta._u||{}, iu=I.meta._u||{};
  Object.keys(I.meta).forEach(k=>{ if(k==='_u') return; if((iu[k]||0)>(mu[k]||0)){ state.meta[k]=I.meta[k]; mu[k]=iu[k]; } });
  state.meta._u=mu;
  if((I.meeting&&I.meeting._u||0)>(state.meeting._u||0)){ const keepLocks=state.meeting.locks; state.meeting=I.meeting; const ids=new Set(state.meeting.locks.map(L=>L.id)); keepLocks.forEach(L=>{ if(!ids.has(L.id)) state.meeting.locks.push(L); }); }
  else { const ids=new Set(state.meeting.locks.map(L=>L.id)); (I.meeting.locks||[]).forEach(L=>{ if(!ids.has(L.id)) state.meeting.locks.push(L); }); }
  state.deleted=del; clearCaches();
  return {added,updated,removed,text: (added||updated||removed)? `Merged from file: ${added} new, ${updated} updated${removed?`, ${removed} removed`:''}. Your own entries were kept.` : 'Already up to date – nothing new in the file.'};
}

/* ---- laptop: automatic save to a file in the Google Drive folder ---- */
function fsSchedule(){ if(!FS.handle||FS.status==='needperm') return; clearTimeout(FS.timer); FS.timer=setTimeout(fsWrite,900); }
async function fsWrite(){
  if(!FS.handle) return; if(FS.busy){ FS.again=true; return; }
  FS.busy=true; FS.status='saving'; fsUpdLight();
  try{
    // pick up anything another device saved into the file first
    try{ const f=await FS.handle.getFile(); if(f.lastModified>(state.ui.fileSeen||0)){ const t=await f.text(); if(t.trim()){ const r=mergeFile(JSON.parse(t)); if(r.added||r.updated||r.removed) toast(r.text); } } }catch(e){}
    const w=await FS.handle.createWritable(); await w.write(JSON.stringify(exportAll())); await w.close();
    try{ state.ui.fileSeen=(await FS.handle.getFile()).lastModified; }catch(e){ state.ui.fileSeen=Date.now(); }
    state.ui.fileDirty=0; state.ui.fileSaved=new Date().toTimeString().slice(0,5); FS.status='ok'; persistLocal();
  }catch(e){ FS.status = (e&&e.name==='NotAllowedError')?'needperm':'error'; console.warn(e); }
  finally{ FS.busy=false; fsUpdLight(); if(FS.again){ FS.again=false; fsWrite(); } }
}
async function fsReadMerge(){
  const f=await FS.handle.getFile(); const t=await f.text(); state.ui.fileSeen=f.lastModified;
  if(!t.trim()) return null;
  const r=mergeFile(JSON.parse(t)); persistLocal(); return r;
}
async function fsUse(h,mode){
  FS.handle=h; FS.name=h.name; await idbSet('fileHandle',h);
  let r=null; if(mode==='open'){ try{ r=await fsReadMerge(); }catch(e){ toast('That file is not a FormTrack storage file.'); FS.handle=null; return; } }
  await fsWrite(); state.pwaFresh=false; render(); toast(r? r.text : 'Storage file connected – saving automatically.');
}
async function fsConnect(mode){
  try{
    const h= mode==='new' ? await window.showSaveFilePicker({suggestedName:'FormTrack-data.json',types:FT_TYPES}) : (await window.showOpenFilePicker({types:FT_TYPES,multiple:false}))[0];
    await fsUse(h,mode);
  }catch(e){ if(e&&e.name!=='AbortError') toast('Could not use that file: '+e.message); }
}
async function fsReconnect(){
  if(!FS.handle) return; try{ const p=await FS.handle.requestPermission({mode:'readwrite'}); if(p==='granted'){ const r=await fsReadMerge(); FS.status='ok'; await fsWrite(); render(); toast(r?r.text:'Storage file reconnected.'); } }catch(e){ toast('Could not reconnect: '+e.message); }
}
async function fsDisconnect(){ FS.handle=null; FS.name=''; FS.status='none'; await idbSet('fileHandle',null); render(); }
async function fsInit(){
  if(!FILEMODE) return;
  if(PWA && 'serviceWorker' in navigator && location.protocol.startsWith('http')){ try{ const had=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had && !window.__ftReloaded){ window.__ftReloaded=1; persistLocal(); location.reload(); } }); navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if(!FS_API) { if(await idbGet('fileHandle')) await idbSet('fileHandle',null); FS.handle=null; FS.status='none'; fsUpdLight(); render(); return; }
  const h=await idbGet('fileHandle'); if(!h){ fsUpdLight(); return; }
  FS.handle=h; FS.name=h.name;
  try{ const p=await h.queryPermission({mode:'readwrite'}); if(p==='granted'){ const r=await fsReadMerge(); FS.status='ok'; if(r&&(r.added||r.updated||r.removed)){ render(); toast(r.text); } await fsWrite(); } else { FS.status='needperm'; } }catch(e){ FS.status='needperm'; }
  render();
}

  if(pid===PRJ.cur){ return; }

  const p=PRJ.list.find(x=>x.id===pid);
  const ui=state.ui;
  state=readProject(pid)||newProjectState(pid,p&&p.name,p&&p.company);
  state.meta.pid=pid; state.ui.sideMini=ui.sideMini; state.ui.fileDirty=ui.fileDirty; state.ui.fileSaved=ui.fileSaved; state.ui.fileOpened=ui.fileOpened; state.ui.fileSeen=ui.fileSeen;
  state.route='dashboard'; PRJ.cur=pid; clearCaches(); persistLocal(); prjSync(); applyTheme(); render();
  if(SYNC.db) syncAttach();
  if(!quiet) toast('Opened project: '+state.meta.project);
}
function openProjects(){
  prjSync();
  const old=document.getElementById('cfm'); if(old) old.remove();
  const d=document.createElement('div'); d.id='cfm'; d.className='cfm';
  const list=[...PRJ.list].sort((a,b)=>(a.id===PRJ.cur?-1:b.id===PRJ.cur?1:(a.name||'').localeCompare(b.name||'')));
  d.innerHTML=`<div class="cfm-box wide" role="dialog" aria-modal="true" aria-label="Projects"><p><b>Projects</b><br><span style="color:var(--muted);font-size:13px">Each project keeps its own data. Tap one to open it.</span></p>
  <div class="prjlist">${list.map(p=>`<button class="prjrow ${p.id===PRJ.cur?'on':''}" onclick="switchProject('${p.id}')"><span class="pi">${esc((p.name||'P').trim().charAt(0).toUpperCase())}</span><span class="pn"><b>${esc(p.name||'Project')}</b><small>${p.company?esc(p.company)+' · ':''}${p.pct==null?'scope not entered':p.pct+'% of scope done'}</small></span>${p.id===PRJ.cur?'<span class="pill ok">OPEN</span>':''}</button>`).join('')}</div>
  <div class="prjnew"><input id="prjName" placeholder="New project name, e.g. DLF Bay View" aria-label="New project name"><button class="btn p" id="prjAdd">+ Add project</button></div>
  <div class="acts"><button class="btn" id="cfmNo">Close</button></div></div>`;
  d.querySelector('#cfmNo').onclick=()=>d.remove(); d.onclick=e=>{ if(e.target===d) d.remove(); };
  const inp=d.querySelector('#prjName'); const add=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } addProject(v); };
  d.querySelector('#prjAdd').onclick=add; inp.onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.body.appendChild(d);
}
function addProject(name){
  if(PRJ.list.some(p=>norm(p.name)===norm(name))){ toast('A project with this name already exists.'); return; }
  const pid=newPid(), company=state.meta.company||'';
  prjSync(); persistLocal();
  const s=newProjectState(pid,name,company);
  try{ localStorage.setItem(pkey(pid),JSON.stringify(s)); }catch(e){}
  PRJ.list.push({id:pid,name,company,pct:null}); prjSave();
  switchProject(pid,true); toast('New project created: '+name+'. Set up its systems and areas first.'); go('setup');
}
function removeProject(pid){
  const p=PRJ.list.find(x=>x.id===pid); if(!p) return;
  if(PRJ.list.length<2){ toast('This is your only project.'); return; }
  askConfirm(`Remove "${p.name}" and all its data from THIS device? Other devices keep their copy. Save a storage file first if you may need it.`,()=>{
    if(pid===PRJ.cur){ const nxt=PRJ.list.find(x=>x.id!==pid); switchProject(nxt.id,true); }
    PRJ.list=PRJ.list.filter(x=>x.id!==pid); prjSave(); try{ localStorage.removeItem(pkey(pid)); }catch(e){}
    if(SYNC.db) prjPushRemote(true,pid); render(); toast('Project removed from this device.');
  },'Remove project');
}
function projectsPanel(){
  prjSync();
  return panel('Projects',`<p class="note">Every project has its <b>own separate data</b> – systems, areas, challans, store, contractors, meeting. Switch any time from the project card at the top of the menu.</p>
  <table class="sheet"><thead><tr><th>Project</th><th>Company</th><th>Scope done</th><th></th></tr></thead><tbody>${PRJ.list.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.id===PRJ.cur?' '+PILL('ok','OPEN'):''}</td><td>${esc(p.company||'')}</td><td>${p.pct==null?'—':p.pct+'%'}</td><td style="white-space:nowrap">${p.id===PRJ.cur?'':`<button class="btn sm" onclick="switchProject('${p.id}')">Open</button> `}${PRJ.list.length>1?`<button class="btn sm" onclick="removeProject('${p.id}')">Remove</button>`:''}</td></tr>`).join('')}</tbody></table>
  <div class="acts" style="margin-top:10px"><button class="btn p" onclick="openProjects()">+ New project / switch</button></div>`);
}

/* ---- storage file with ALL projects ---- */
function stripState(s){ const out={}; Object.keys(s).forEach(k=>{ if(['ui','route','pending','firstRun','pwaFresh'].includes(k)) return; out[k]=s[k]; }); return out; }
function exportAll(){
  prjSync(); persistLocal();
  const projects=PRJ.list.map(p=>{ const st= p.id===PRJ.cur? state : readProject(p.id); return st?{id:p.id,name:p.name,company:p.company,state:stripState(st)}:null; }).filter(Boolean);
  return {format:'formtrack',version:2,savedAt:new Date().toISOString(),savedBy:navigator.userAgent.slice(0,60),current:PRJ.cur,projects};
}
function mergeInto(pid,inc,P){
  if(pid===PRJ.cur){ const r=mergeState(inc); state.meta.pid=pid; return r; }
  const saved=state; const ex=readProject(pid); let r;
  state= ex || newProjectState(pid,P&&P.name,P&&P.company);
  try{ r=mergeState(inc); state.meta.pid=pid; localStorage.setItem(pkey(pid),JSON.stringify(state));
    let p=PRJ.list.find(x=>x.id===pid); if(!p){ p={id:pid}; PRJ.list.push(p); } p.name=state.meta.project; p.company=state.meta.company||''; p.pct=prjPct(state);
  } finally { state=saved; clearCaches(); }
  r.isNew=!ex; return r;
}
function mergeFile(raw){
  if(raw&&raw.format==='formtrack'&&Array.isArray(raw.projects)){
    let a=0,u=0,rm=0; const newNames=[];
    raw.projects.forEach(P=>{ if(!P||!P.id||!P.state) return; const r=mergeInto(P.id,P.state,P); a+=r.added; u+=r.updated; rm+=r.removed; if(r.isNew) newNames.push(P.name||'project'); });
    prjSync(); clearCaches();
    const txt=(a||u||rm||newNames.length)? `Merged from file: ${a} new, ${u} updated${rm?`, ${rm} removed`:''}${newNames.length?` · new project${newNames.length>1?'s':''}: ${newNames.join(', ')}`:''}. Your own entries were kept.` : 'Already up to date – nothing new in the file.';
    return {added:a,updated:u,removed:rm,text:txt};
  }
  const r=mergeState(raw); prjSync(); return r; /* older single-project file → current project */
}

/* ---- online (inside Claude): each project in its own collection ---- */
const syncCol=()=>PRJ.cur===MAIN_PID?'ct':'ct_'+PRJ.cur.replace(/[^a-z0-9]/gi,'');
let PRJ_REMOTE_T=null;
function prjPushRemote(now,removedPid){
  if(!SYNC.db) return; clearTimeout(PRJ_REMOTE_T);
  const go_=async()=>{ try{ const ref=SYNC.db.doc('ct/_projects'); const s=await ref.get(); const rem=s.exists?(s.data().removed||{}):{}; if(removedPid) rem[removedPid]=nowMs();
    const list=PRJ.list.map(p=>({id:p.id,name:p.name,company:p.company||'',pct:p.pct==null?null:p.pct}));
    const other=s.exists?(s.data().list||[]):[]; other.forEach(o=>{ if(!list.find(x=>x.id===o.id)&&!rem[o.id]&&o.id!==removedPid) list.push(o); });
    await ref.set({list,removed:rem}); }catch(e){} };
  if(now) go_(); else PRJ_REMOTE_T=setTimeout(go_,1500);
}
async function prjPullRemote(){
  try{ const s=await SYNC.db.doc('ct/_projects').get(); if(!s.exists) return; const d=s.data(), rem=d.removed||{};
    (d.list||[]).forEach(o=>{ if(rem[o.id]) return; const p=PRJ.list.find(x=>x.id===o.id); if(!p) PRJ.list.push(o); else if(o.id!==PRJ.cur){ p.name=o.name; p.company=o.company; p.pct=o.pct; } });
    PRJ.list=PRJ.list.filter(p=>!rem[p.id]||p.id===PRJ.cur); prjSave(); }catch(e){}
}

/* ---------- files ---------- */
async function download(filename,text,type){ /* text may be a string or an ArrayBuffer */
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){ try{ await dl.save({filename,data:text}); toast('Saved: '+filename); }catch(e){ if(!e||e.code!=='declined') toast('Could not save the file here ('+((e&&e.code)||'error')+'). Open the HTML file on your device to export.'); } return; }
      if(EMBED){ toast('Saving files is not available in this view. Open the HTML file on your device to export.'); return; }
    }
  }catch(e){}
  const blob=new Blob([text],{type:type||'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function downloadBackup(){ state.meta.lastBackup=todayStr(); persist(); download(`FormTrack-backup-${slug(state.meta.project)}-${todayStr()}.json`,JSON.stringify(state,null,1),'application/json'); render(); toast('Backup downloaded.'); }
function restoreBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{ let p0; try{ p0=JSON.parse(rd.result); }catch(e){ toast('This file could not be read – it may not have downloaded fully. Download it again and retry.'); return; } try{ const p=p0; if(p&&p.format==='formtrack'){ const r=mergeFile(p); state.pwaFresh=false; save(); toast(r.text); return; } if(!p||!Array.isArray(p.systems)) throw 0; askConfirm('Replace all current data with this backup?',()=>{ state=hydrate(p); state.meta.pid=PRJ.cur; save(); prjSync(); toast('Backup restored.'); },'Restore'); }catch(e){ toast('This is not a valid FormTrack backup.'); } };
  rd.readAsText(file);
}
function resetAll(){ askConfirm('Delete ALL data of this project on this device? Other projects are not touched. This cannot be undone. Download a backup first if you need it.',()=>{ const d={}; Object.keys(state).forEach(k=>{ if(Array.isArray(state[k])) state[k].forEach(r=>{ if(r&&r.id) d[r.id]=nowMs(); }); }); const nm=state.meta.project, co=state.meta.company; state=seed(); state.meta.pid=PRJ.cur; if(PRJ.cur!==MAIN_PID){ state.meta.project=nm; state.meta.company=co; } state.deleted=d; save(); },'Delete everything'); }
const csvCell=v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const csv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n');
function CSV_SPEC(){ return {
    ledger:[['Date','System','Area','Type','Challan','Item','Sqm','Nos','Claim','Remarks'],t=>[t.date,sysName(t.systemId),areaName(t.areaId),t.type,t.challan,t.item,t.sqm,t.nos,t.amount,t.remarks]],
    invoices:[['Month','System','Invoice no','Invoice rent','Our calculation','Difference','Remarks'],i=>{const d=invoiceDiff(i); return [i.month,sysName(i.systemId),i.invoiceNo,i.amount,d.calc.toFixed(0),d.diff.toFixed(0),i.remarks];}],
    execution:[['Date','System','Area','Element','Sqm','Remarks'],e=>[e.date,sysName(e.systemId),areaName(e.areaId),e.element,e.sqm,e.remarks]],
    owned:[['System','Item','Unit','Qty','Purchase cost','Expected uses','Uses so far','Cost per use','Book value'],o=>{const c=ownedCalc(o); return [sysName(o.systemId),o.item,o.unit,o.qty,o.totalCost,o.expectedReps,c.used.toFixed(2),c.perUse.toFixed(0),c.book.toFixed(0)];}],
    scope:[['System','Area','Element','Scope sqm','Planned start','Planned finish','Executed','Balance','% done','Actual start','Status'],sc=>{const s=scopeStatus(sc); return [sysName(sc.systemId),areaName(sc.areaId),sc.element,sc.scopeSqm,sc.plannedStart,sc.plannedFinish,s.executed.toFixed(2),s.balance.toFixed(2),(s.pct*100).toFixed(1),s.actualStart,s.label];}],
    labour:[['Date','System','Area','Element','Carpenters','Helpers','Hours','Mandays','Cost','Remarks'],r=>[r.date,sysName(r.systemId),areaName(r.areaId),r.element,r.carpenters,r.helpers,r.hours,mandays([r]).toFixed(2),labourCost([r]).toFixed(0),r.remarks]],
    itemTx:[['Date','System','Document','Code','Item','Type','Nos','Area','Sqm','Remarks'],t=>{const it=itemObj(t.itemId)||{}; return [t.date,sysName(t.systemId),t.doc,it.code,it.item,t.type,t.nos,t.areaId?areaName(t.areaId):'',(num(t.nos)*num(it.sqmPerNo)).toFixed(3),t.remarks];}],
    items:[['System','Code','Item','Sqm/no','Kg/no','BOQ','Rate/pc/day','Received','Returned','On site','Sqm on site','Last received','Last returned','Status'],i=>{const t=itemTotals(i.id); return [sysName(i.systemId),i.code,i.item,i.sqmPerNo,i.kgPerNo,i.boq,i.ratePcDay,t.r,t.d,t.bal,(Math.max(0,t.bal)*num(i.sqmPerNo)).toFixed(3),t.lastR,t.lastD,itemStatus(i,t)[1]];}],
    consTx:[['Date','Item','Unit','Type','Qty','System','Area','Value','Remarks'],t=>{const c=consObj(t.itemId)||{}; return [t.date,c.item,c.unit,t.type,t.qty,t.systemId?sysName(t.systemId):'Shared',t.areaId?areaName(t.areaId):'All',consCostTx(t).toFixed(0),t.remarks];}],
    storeItems:[['Item','Type','Unit','Rate','Min in store','In store','With contractors','Used','Damaged','Missing','Scrapped','Open PO','Status'],i=>{const b=storeBal(i.id); return [i.item,i.kind,i.unit,i.rate,i.minStock,b.inStore,b.withCon,b.used,b.damaged,b.missing,b.scrapped,openPOQty(i.item),stripTags(storeStatus(i,b)[1])];}],
    storeTx:[['Date','Movement','Item','Unit','Qty','Contractor','Area','Challan / GRN','Remarks'],t=>{const it=storeObj(t.itemId)||{}; return [t.date,t.type,it.item,it.unit,t.qty,t.contractorId?conName(t.contractorId):'',t.areaId?areaName(t.areaId):'',t.doc,t.remarks];}],
    prpo:[['Category','Item','Qty','Unit','Value','Vendor','PR no','PR date','PO no','PO date','Required by','Received on','Status','Remarks'],p=>[p.category,p.item,p.qty,p.unit,p.value,p.vendor,p.prNo,p.prDate,p.poNo,p.poDate,p.requiredBy,p.receivedDate,prStatus(p)[1],p.remarks]],
    contractorSheet:[['Contractor','Item','Unit','Taken','Returned good','Returned damaged','Missing','Still holding','Rate','Est. cost (damaged + missing)'],x=>[x.c.name,x.i.item,x.i.unit,x.b.issued,x.b.retGood,x.b.retDam,x.b.missing,x.b.withCon,x.i.rate,(x.b.retDam+x.b.missing)*num(x.i.rate)]],
  }; }
function exportCSV(arr){
  const map=CSV_SPEC()[arr], src=arr==='contractorSheet'?contractorRows():state[arr];
  download(`${arr}-${todayStr()}.csv`,csv([map[0],...src.map(map[1])]),'text/csv');
}
function exportRentCSV(){
  const rows=[['Month','System','Area','Rate','Required sqm','Days','Sqm-days','Rent','Excess rent']];
  allMonthsUpTo(thisMonth()).forEach(m=>rentalSystems().forEach(s=>ledgerAreas(s.id).forEach(a=>{const x=monthRent(s.id,a,m); rows.push([m,s.name,areaName(a),x.rate,x.req,x.daysCounted+'/'+x.dim,x.sqmDays.toFixed(2),x.rent.toFixed(0),x.excess.toFixed(0)]);})));
  download(`rent-summary-${todayStr()}.csv`,csv(rows),'text/csv');
}
function exportCostCSV(){
  const gb=state.ui.groupBy, rows=[['Period','System','Area','Element','Executed sqm','Rent/bill','Labour','Consumables','Owned material','Total','Cost per sqm']];
  const pl=state.ui.period==='todate'?'To date '+(state.ui.month):state.ui.month;
  costGrouped().forEach(g=>rows.push([pl,sysName(g.s),gb==='area'?areaName(g.a):'',gb==='element'?g.el:'',g.sqm.toFixed(2),g.rent.toFixed(0),g.lab.toFixed(0),g.cons.toFixed(0),g.own.toFixed(0),g.total.toFixed(0),g.sqm?(g.total/g.sqm).toFixed(2):'']));
  download(`system-cost-${todayStr()}.csv`,csv(rows),'text/csv');
}

/* ---------- shell ---------- */
function go(r){ state.route=r; persist(); render(); document.getElementById('main').scrollTop=0; }
function updateElementList(){
  const set=new Set(); state.scope.forEach(s=>s.element&&set.add(String(s.element).trim())); state.execution.forEach(e=>e.element&&set.add(String(e.element).trim()));
  document.getElementById('elist').innerHTML=[...set].sort().map(v=>`<option value="${esc(v)}">`).join('');
}
function render(){
  applyTheme();
  if(!PAGES[state.route]||!NAV.some(g=>g.items.some(([k])=>k===state.route))) state.route='dashboard';
  const side=document.getElementById('side');
  side.className=state.ui.sideMini?'mini':''; side.innerHTML=sideHTML();
  updateElementList();
  const main=document.getElementById('main'), st=main.scrollTop;
  const title=NAV.flatMap(g=>g.items).find(([k])=>k===state.route);
  let body;
  try{ body=PAGES[state.route](); }catch(e){ console.error(e); body=`<div class="banner">${PILL('bd','ERROR')} This page could not be shown: ${esc(e.message)}. Your data is safe — download a backup from "Backup & Settings".</div>`; }
  main.innerHTML=`<div class="mh"><div><button class="company edit ${state.meta.company?'':'empty'}" onclick="editName('company',this)" title="Click to edit company name">${state.meta.company?esc(state.meta.company):'+ Add company name'}</button><button class="projname edit" onclick="editName('project',this)" title="Click to edit project name">${esc(state.meta.project)}</button><button class="prjsw" onclick="openProjects()" title="Switch project or add a new one">⇅ Projects${PRJ.list.length>1?` (${PRJ.list.length})`:''}</button><h1>${title[1]}${state.meta.location?`<span class="loc">${esc(state.meta.location)}</span>`:''}</h1></div><div class="acts noprint">${syncLight()}<button class="btn sm" onclick="openThemes()">🎨 Colours</button><button class="btn sm" onclick="exportExcel()">⬇ Excel</button><button class="btn sm" onclick="downloadBackup()">Backup</button>${EMBED?'':'<button class="btn sm" onclick="window.print()">Print</button>'}</div></div>`+(hasDemo()&&state.route!=='help'?`<div class="banner demo">${PILL('wn','PRACTICE DATA')} <span>Scope, execution, labour, targets, consumables, store entries, contractors and PRs marked PRACTICE are sample data. Vendor material data is real.</span><button class="btn sm d" onclick="removeDemoData()">Remove practice data</button></div>`:'')+body;
  main.scrollTop=st;
}
load(); prjSync(); if(state.firstRun){ delete state.firstRun; if(!FILEMODE) loadDemoData(true); state.route='dashboard'; state.pending=true; persistLocal(); } render(); initSync(); fsInit();
