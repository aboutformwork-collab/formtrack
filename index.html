      if(T.A.extraMat>0.5) opt.push(`<tr><td class="v"><b>1b. Finish on time – add material</b><br><small class="muted">keep ${fmtN(P.rpm,1)} repetitions/month</small></td><td class="calc">${fmtN(T.A.needM)} sqm/month · ${fmtN(P.rpm,1)} repetitions/month</td><td class="calc"><b>${fmtN(T.A.labDay,1)}</b> / day${T.A.extraLab>0.05?` <span class="neg">(+${fmtN(T.A.extraLab,1)})</span>`:''}</td><td class="calc"><span class="neg">+${fmtN(T.A.extraMat)} sqm material</span></td><td class="calc r"><span class="neg">+${money(T.A.xRent)}</span></td><td class="calc r"><b class="neg">${money(T.A.unit)}</b></td><td class="calc r">${fmtD(P.finish)}</td></tr>`); }
    if(T.B) opt.push(`<tr><td class="v"><b>2. Continue at planned pace</b><br><small class="muted">${fmtN(P.sqmM)} sqm/month</small></td><td class="calc">${fmtN(P.sqmM)} sqm/month · ${fmtN(P.rpm,1)} repetitions/month</td><td class="calc">${fmtN(P.labDay,1)} / day</td><td class="calc">same material${T.B.xM>0?', kept longer':', released earlier'}</td><td class="calc r">${xr(T.B.xRent,T.B.xM)}</td><td class="calc r"><b class="${T.B.xRent>1?'neg':''}">${money(T.B.unit)}</b></td><td class="calc r">${fmtD(T.B.fin)}</td></tr>`);
    if(T.C) opt.push(`<tr><td class="v"><b>3. Continue at actual pace</b><br><small class="muted">${fmtN(T.C.pace)} sqm/month so far</small></td><td class="calc">${fmtN(T.C.pace)} sqm/month</td><td class="calc">as now</td><td class="calc">same material${T.C.xM>0?', kept longer':', released earlier'}</td><td class="calc r">${xr(T.C.xRent,T.C.xM)}</td><td class="calc r"><b class="${T.C.xRent>1?'neg':''}">${money(T.C.unit)}</b></td><td class="calc r">${fmtD(T.C.fin)}</td></tr>`);
    d+=opt.length?simpleTable([['Option'],['Output needed'],['Labour'],['Material'],['Extra cost',1],['Unit cost',1],['Finish',1]],opt,`<tr><td>Planned</td><td></td><td>${fmtN(P.labDay,1)} / day</td><td>${fmtN(P.mat)} sqm</td><td></td><td class="r"><b>${money(P.unit)}</b></td><td class="r">${fmtD(P.finish)}</td></tr>`):`<p class="note">Plan complete.</p>`;
    h+=panel('Delay tracking & recovery',d,'today '+fmtD(todayStr())); }
  return h;
}
function cmpView(){
  const grps=[...new Set(state.sysCmp.map(r=>r.grp||'—'))], g=grps.includes(state.ui.cmpGrp)?state.ui.cmpGrp:(grps[0]||'');
  const rows=state.sysCmp.filter(r=>(r.grp||'—')===g);
  let h=`<div class="chips"><label>Area / comparison</label>${grps.map(x=>`<button class="btn sm ${x===g?'p':''}" onclick="setUI('cmpGrp','${esc(x).replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>`;
  const C=new Map(rows.map(r=>[r.id,planCalc(r)])), ok=rows.filter(r=>C.get(r.id).scope&&C.get(r.id).mat);
  const best=ok.slice().sort((a,b)=>C.get(a.id).unit-C.get(b.id).unit)[0], fast=ok.slice().sort((a,b)=>C.get(a.id).dur-C.get(b.id).dur)[0];
  const nm=r=>esc(sysName(r.systemId))+` <small class="muted">${r.own==='Purchase'?'purchase':'rental'}</small>`;
  h+=panel('Systems to compare',table('sysCmp',[{key:'grp',label:'Area / comparison',w:130},{key:'systemId',label:'System',type:'system',w:140},{key:'scope',label:'Qty (sqm)',type:'number',r:1},{key:'matSqm',label:'Material (sqm)',type:'number',r:1},
    {key:'repsPerMonth',label:'Repetitions / month',type:'number',r:1},{key:'prod',label:'Productivity (sqm/manday)',type:'number',r:1},...LABCOLS(),...MATCOLS(),
    {key:'cons',label:`Consumables (${cur()}/sqm)`,type:'number',r:1},{key:'transport',label:`Transport (${cur()} total)`,type:'number',r:1},{key:'other',label:`Other (${cur()}/sqm)`,type:'number',r:1},
    {label:'',calc:r=>`<button class="btn sm" onclick="fillPlanFromApp('sysCmp','${r.id}')" title="Fill rent, productivity, wage, consumables from your site records">⤓ app</button>`}],{rows,noSum:1,noFilter:1}));
  if(!ok.length) return h+`<p class="note">Add two or more systems for the same area to compare.</p>`;
  const H=[['System'],['Repetitions',1],['Duration',1],['Labour / day',1],['Rent or (purchase − scrap) / sqm',1],['Labour / sqm',1],['Consumables / sqm',1],['Transport / sqm',1],['Other / sqm',1],['Total / sqm',1],['Total cost',1],['']];
  const R=ok.slice().sort((a,b)=>C.get(a.id).unit-C.get(b.id).unit).map((r,i)=>{ const P=C.get(r.id), q=P.scope||1, bU=C.get(best.id).unit;
    return `<tr class="${r===best?'dnew':''}"><td class="v" style="white-space:nowrap"><b>${i+1}. ${nm(r)}</b></td><td class="calc r">${fmtN(P.reps)}</td><td class="calc r">${mo(P.dur)}</td><td class="calc r">${fmtN(P.labDay,1)}</td><td class="calc r">${money((P.rentT+P.matNet)/q)}${P.buy?`<br><small class="muted">= rent of ${money(P.eqRent)}/sqm/month</small>`:''}</td><td class="calc r">${money(P.labT/q)}${P.pieceRate?'<br><small class="muted">per sqm rate</small>':''}</td><td class="calc r">${money(P.consT/q)}</td><td class="calc r">${money(num(r.transport)/q)}</td><td class="calc r">${money(num(r.other))}</td><td class="calc r"><b>${money(P.unit)}</b>${r!==best?`<br><small class="neg">+${money(P.unit-bU)} (+${fmtN(bU?(P.unit-bU)/bU*100:0,0)}%)</small>`:''}</td><td class="calc r">${money(P.total)}</td><td class="v" style="white-space:nowrap">${r===best?PILL('ok','Lowest cost'):''} ${r===fast?PILL('na','Fastest'):''}</td></tr>`; });
  h+=panel('Result – '+esc(g),`<p class="mb-say" style="background:color-mix(in srgb,var(--good) 8%,var(--paper))"><b>${nm(best)}</b> is the lowest cost at <b>${money(C.get(best.id).unit)} /sqm</b> (${mo(C.get(best.id).dur)})${fast!==best?`; <b>${nm(fast)}</b> is fastest at ${mo(C.get(fast.id).dur)} and ${money(C.get(fast.id).unit)} /sqm`:' and also the fastest'}.</p>`+simpleTable(H,R),'sorted by total cost per sqm');
  return h;
}

PAGES.rentbuy=()=>{
  let h=`<p class="note hint">Enter the purchase cost per sqm for each rental system. Break-even = purchase cost ÷ monthly rent per sqm. If the material stays longer than the break-even, buying would likely have been cheaper (ignoring repairs, transport and resale).</p>`;
  const months=allMonthsUpTo(thisMonth());
  h+=panel('Rent vs buy',simpleTable([['System'],[`Buy cost (${cur()}/sqm)`,1],[`Avg rent (${cur()}/sqm/month)`,1],['Break-even (months)',1],['Months on site',1],['Rent paid to date',1],['Cost to buy peak qty',1],['Verdict']],
    rentalSystems().map(s=>{
      const ar=avgRate(s.id), bc=num(s.buyCostPerSqm), be=ar&&bc?bc/ar:0;
      const onMonths=months.filter(m=>systemMonthRent(s.id,m).sqmDays>0).length;
      const peakQty=ledgerAreas(s.id).reduce((a,ar2)=>a+Math.max(0,...months.map(m=>monthRent(s.id,ar2,m).peak)),0);
      const paid=months.reduce((a,m)=>a+systemMonthRent(s.id,m).rent,0);
      const v=!bc||!ar? PILL('na','Enter buy cost') : (onMonths>=be? PILL('wn','Buying would have been cheaper') : PILL('ok','Renting is cheaper so far'));
      return `<tr><td class="v">${esc(s.name)}</td><td><input type="number" step="any" class="c r" value="${bc||''}" onchange="setField('systems','${s.id}','buyCostPerSqm',this.value,true)"></td><td class="calc r">${fmtN(ar)}</td><td class="calc r">${be?fmtN(be,1):'—'}</td><td class="calc r">${onMonths}</td><td class="calc r">${money(paid)}</td><td class="calc r">${bc?money(peakQty*bc):'—'}</td><td class="v">${v}</td></tr>`;})));
  return h;
};

function removeDemoData(){
  askConfirm('Remove all PRACTICE data (scope, execution, labour, targets, consumable and store entries, practice contractors and PRs)? Your vendor data and anything you typed yourself stays.',()=>{
  ['scope','execution','labour','targets','consTx','storeTx','contractors','prpo'].forEach(k=>state[k]=(state[k]||[]).filter(r=>{ if(r.demo){ tomb(r.id); return false; } return true; }));
  const set=state.meta.demoSet||{};
  if(set.carpenterWage) state.meta.carpenterWage=0; if(set.helperWage) state.meta.helperWage=0;
  Object.keys(set).filter(k=>k.startsWith('std|')).forEach(k=>{ const s=sysObj(k.slice(4)); if(s) s.stdSqmPerManday=0; });
  const oil=state.consItems.find(c=>norm(c.item)==='shuttering oil'), cone=state.consItems.find(c=>norm(c.item)==='tie cone');
  const ply=state.storeItems.find(i=>norm(i.item)==='plywood 18 mm'), run=state.storeItems.find(i=>norm(i.item)==='runner 75x75');
  if(ply&&set.plyRate) ply.rate=0; if(ply&&set.plyMin) ply.minStock=0; if(run&&set.runRate) run.rate=0; if(run&&set.runMin) run.minStock=0;

// flow of one item: store, with contractors, damaged, missing, scrapped
function storeBalRaw(itemId, conId, upto){
  const b={open:0,openCon:0,received:0,recDmg:0,recShort:0,tin:0,tout:0,issued:0,retGood:0,retDam:0,missing:0,repaired:0,scrapped:0};
  state.storeTx.forEach(t=>{ if(t.itemId!==itemId || (conId && t.contractorId!==conId) || (upto && t.date>upto)) return; const q=num(t.qty);
    switch(t.type){ case 'Available on takeover': b.open+=q; break; case 'Available on takeover – with contractor': b.openCon+=q; b.issued+=q; break; case 'Received (purchase)': b.received+=q; b.recDmg+=num(t.dmgQty); b.recShort+=num(t.shortQty); break; case 'Transfer in (other site)': b.tin+=q; break; case 'Transfer out (other site)': b.tout+=q; break; case 'Returned to supplier': b.retSup=(b.retSup||0)+q; break; case 'Issued to contractor': b.issued+=q; break; case 'Returned good': b.retGood+=q; break;
      case 'Returned damaged': b.retDam+=q; break; case 'Missing': b.missing+=q; break; case 'Repaired': b.repaired+=q; break; case 'Scrapped': b.scrapped+=q; break; } });
  const it=storeObj(itemId)||{}, cons=it.kind==='Consumable';
  b.withCon = cons? 0 : b.issued-b.retGood-b.retDam-b.missing;
  b.used = cons? b.issued-b.retGood : 0;
  b.recGood = b.received-b.recDmg-b.recShort;
  b.inStore = b.open+b.recGood+b.tin-b.tout-(b.retSup||0)-(b.issued-b.openCon)+b.retGood+b.repaired;
  b.damaged = b.retDam-b.repaired-b.scrapped;
  b.total = b.inStore+b.withCon+b.damaged;
  return b;
}
/* PHYSICAL STOCK CHECK – a count on a date replaces the book stock from that date on.

function physList(kind,id,upto){ const arr=kind==='cons'?state.consTx:state.storeTx;
  const L=arr.filter(t=>t.type==='Physical count'&&t.itemId===id&&t.date&&(!upto||t.date<=upto)).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  const arr2=kind==='cons'?state.consTx:state.storeTx;
  let adj=0; return L.map((t,i)=>{ const raw=kind==='cons'?consStockRaw(id,t.date):storeBalRaw(id,null,t.date).inStore, book=raw+adj, d=num(t.qty)-book; adj+=d;
    const start=i===0&&!arr2.some(x=>x.itemId===id&&x.type!=='Physical count'&&x.date&&x.date<t.date); return {t,book,d,start}; }); }
function physAdj(kind,id,upto){ const L=physList(kind,id,upto); const st=L.filter(x=>x.start).reduce((a,x)=>a+x.d,0), df=L.filter(x=>!x.start).reduce((a,x)=>a+x.d,0);
  return {adj:st+df,start:st,diff:df,last:L.length?L[L.length-1].t.date:'',n:L.length}; }
function storeBal(itemId,conId,upto){ const b=storeBalRaw(itemId,conId,upto); b.adj=0; b.lastChk='';
  if(!conId){ const a=physAdj('store',itemId,upto); b.adj=a.adj; b.start=a.start; b.chkDiff=a.diff; b.lastChk=a.n>(a.start?1:0)?a.last:''; b.inStore+=a.adj; b.total=b.inStore+b.withCon+b.damaged; } return b; }

function storeStatus(it,b){
  if(b.inStore<-1e-9||b.withCon<-1e-9||b.damaged<-1e-9) return ['bd','Check entries'];
  const min=num(it.minStock), po=openPOQty(it.item);
  if(min>0 && b.inStore+po<min) return ['bd',`Raise PR ${fmtN(min*2-b.inStore-po)} ${esc(it.unit)}`];
  if(min>0 && b.inStore<min) return ['wn','Low – PO pending'];

const RENT_STORE_TYPES=['Issued to contractor','Returned good','Returned damaged','Missing','Repaired','Damaged sent back to vendor','Missing settled with vendor'];
const rentStoreSys = () => { const L=state.systems.filter(x=>state.items.some(i=>i.systemId===x.id)); const v=state.ui.rsSys; return L.some(x=>x.id===v)?v:(L[0]||{}).id||''; };
const rentStoreItems = () => state.items.filter(i=>i.inStore&&(state.route!=='store'||i.systemId===rentStoreSys()));
/* vendor return challans (Item-wise Material) reduce "on site", so they reduce store stock automatically.
   Damaged pieces sent back on such a challan are marked "Damaged sent back to vendor" so they leave the damaged pile, not the good stock. */
function rentStoreBal(i){ const t=itemTotals(i.id), b=storeBal(i.id), Q=ty=>state.storeTx.filter(x=>x.itemId===i.id&&x.type===ty).reduce((a,x)=>a+num(x.qty),0);
  const dmg=Math.max(0,b.retDam-b.repaired-Q('Damaged sent back to vendor')), mis=Math.max(0,b.missing-Q('Missing settled with vendor')), wc=b.issued-b.retGood-b.retDam-b.missing;
  return {onSite:t.bal,r:t.r,d:t.d,issued:b.issued,withCon:wc,damaged:dmg,missing:mis,inStore:t.bal-wc-dmg-mis}; }

/* ---------- STORE COST (rate × qty for every movement) ---------- */
const rentFac = i => { const u=i.storeRateUnit||'Nos'; return u==='Sqm'?num(i.sqmPerNo):u==='Kg'?num(i.kgPerNo):1; };

  return state.items.filter(i=>i.inStore).map(i=>{ const b=rentStoreBal(i), sb=storeBal(i.id); return {name:(i.code?i.code+' – ':'')+i.item,sid:i.systemId,sys:sysName(i.systemId),unit:'Nos',rate:num(i.storeRate),per:i.storeRateUnit||'Nos',f:rentFac(i),q:[b.r,sb.issued,b.d,sb.retDam,sb.missing,0,b.inStore,0,0]}; });
}
function costTotals(g,sid){ const T=[0,0,0,0,0,0,0,0,0]; costRows(g).filter(r=>!sid||r.sid===sid).forEach(r=>r.q.forEach((q,k)=>T[k]+=(k===7?q:Math.max(0,q))*r.f*r.rate)); return T; }
function costPanel(g,sid){
  const C=COSTCOLS[g], R=costRows(g).filter(r=>!sid||r.sid===sid); if(!R.length) return '';
  const R0=costRows(g), idx=CORD.filter(k=>C.h[k]!=='—'&&((k!==7&&k!==8)||R0.some(r=>r.q[k]))), T=[0,0,0,0,0,0,0,0,0], noRate=R.filter(r=>!r.rate).length;
  const red=(k,v)=>((k===3||k===4)&&v)||(k===7&&v<0)?'neg':'';
  const line=r=>`<tr><td class="v"><b>${esc(r.name)}</b></td><td class="calc r">${r.rate?money(r.rate)+` <small class="muted">/${esc(r.per)}</small>`:'<span class="muted">no rate</span>'}</td>${idx.map(k=>{ const q=r.q[k], v=(k===7?q:Math.max(0,q))*r.f*r.rate; T[k]+=v; return `<td class="calc r">${q?`<b class="${red(k,v)}">${r.rate?money(v):'—'}</b><br><small class="muted">${fmtN(q,Math.abs(q-Math.round(q))>1e-9?2:0)} ${esc(r.unit)}</small>`:'—'}</td>`; }).join('')}</tr>`;

function costSummaryView(){

function meetState(key,c){ const ap=state.meeting.approved[key]; if(!ap) return ['na','Not approved']; return ap===c.hash? ['ok','Approved'] : ['wn','Changed since approval']; }

function approveCard(k){ state.meeting.approved[k]=meetCard(k).hash; touchMeeting(); save(); }

function toggleCard(k,on){ state.meeting.cards[k]=on; touchMeeting(); save(); }
PAGES.meeting=()=>{
  const vis=meetVisible(), C={}; MEET_CARDS.forEach(([k])=>C[k]=meetCard(k));

  h+=panel('1. Choose what is shown and check it',`<div class="tw"><table class="sheet"><thead><tr><th>Show</th><th>Card</th><th>Check before meeting</th><th>Approval</th><th></th></tr></thead><tbody>${MEET_CARDS.map(([k,t])=>{ const c=C[k], st=meetState(k,c); return `<tr><td class="v" style="text-align:center"><input type="checkbox" ${state.meeting.cards[k]?'checked':''} onchange="toggleCard('${k}',this.checked)" aria-label="Show ${t}"></td><td class="v"><b>${t}</b></td><td class="v">${c.warn.length?c.warn.map(w=>`<div>${PILL('wn','CHECK')} ${esc(w)}</div>`).join(''):PILL('ok','No issues found')}</td><td class="v">${state.meeting.cards[k]?PILL(st[0],st[1]):PILL('na','Hidden')}</td><td class="v">${state.meeting.cards[k]?`<button class="btn sm" onclick="approveCard('${k}')">Approve</button>`:''}</td></tr>`; }).join('')}</tbody></table></div><p class="note hint" style="margin-top:6px">A card you approved shows "Changed since approval" if its numbers change afterwards, so nothing new reaches the meeting without your check.</p>`);

function lockMeeting(){
  const vis=meetVisible().filter(([k])=>!state.meeting.requireApproval||meetState(k,meetCard(k))[0]==='ok');
  if(!vis.length){ toast('Nothing to lock – switch on and approve some cards first.'); return; }
  const title=`Meeting ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})} – ${monthLabel(state.ui.month||thisMonth())}`;
  state.meeting.locks.push({id:uid(),title,created:new Date().toLocaleString('en-IN'),month:state.ui.month||thisMonth(),cards:vis.map(([k,t])=>({key:k,title:t,html:meetCard(k).html}))});
  if(state.meeting.locks.length>12) state.meeting.locks.shift(); touchMeeting();
  save(); toast('🔒 Locked: '+title);
}
function delLock(id){ askConfirm('Delete this locked meeting copy? You can undo it.',()=>{ const L0=state.meeting.locks.find(L=>L.id===id); if(L0) binPut('@lock',[L0]); state.meeting.locks=state.meeting.locks.filter(L=>L.id!==id); touchMeeting(); save(); },'Delete'); }
function present(lockId){

  else { title='Formwork status – '+monthLabel(state.ui.month||thisMonth()); cards=meetVisible().map(([k,t])=>({key:k,title:t,c:meetCard(k)})).filter(x=>!state.meeting.requireApproval||meetState(x.key,x.c)[0]==='ok').map(x=>({title:x.title,html:x.c.html})); }

  d.innerHTML=`<div class="phead"><div>${state.meta.company?`<span class="pco">${esc(state.meta.company)}</span>`:''}<b>${esc(state.meta.project)}</b><span>${esc(title)}</span></div><button class="btn" onclick="closePresent()">Exit ✕</button></div><div class="mgrid big">${cards.map(c=>`<div class="mcard"><h4>${c.title}</h4>${c.html}</div>`).join('')}</div><div class="pfoot">${state.meta.user?'Prepared by '+esc(state.meta.user)+' · ':''}${new Date().toLocaleDateString('en-IN')}</div>`;
  document.body.appendChild(d); document.body.classList.add('presenting');
  try{ if(d.requestFullscreen && !EMBED) d.requestFullscreen().catch(()=>{}); }catch(e){}
}
/* dashboard full screen – hides the menu and page header, uses the whole screen */
function dashFull(on){ document.body.classList.toggle('dfull',!!on);
  try{ if(on&&document.documentElement.requestFullscreen&&!EMBED) document.documentElement.requestFullscreen().catch(()=>{}); if(!on&&document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  let x=document.getElementById('dfx'); if(on&&!x){ x=document.createElement('button'); x.id='dfx'; x.className='btn'; x.innerHTML=`<b>${esc(state.meta.project||'')}</b> · Exit full screen ✕`; x.onclick=()=>dashFull(false); document.body.appendChild(x); } if(!on&&x) x.remove(); }
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&document.body.classList.contains('dfull')) dashFull(false); });
function closePresent(){ const d=document.getElementById('present'); if(d) d.remove(); document.body.classList.remove('presenting'); try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }

/* ---------- PASTE FROM EXCEL ---------- */
const PCOLS={}, PPRESET={ itemTx:()=>({systemId:curItemSys()}) };
const stripTags=s=>String(s||'').replace(/<[^>]+>/g,'').trim();
const byName=(list,key,raw)=>{ const r=norm(raw); const x=list.find(o=>norm(o[key])===r) || list.find(o=>norm(o[key]).startsWith(r)&&r.length>=3); return x? x.id : undefined; };
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDate(raw){
  raw=String(raw).trim(); let m;
  if(/^\d{5}(\.\d+)?$/.test(raw)){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(+raw)*86400000); return d.toISOString().slice(0,10); }
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(raw))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(raw))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  if((m=/^(\d{1,2})[-\s\/]?([A-Za-z]{3,4})[A-Za-z]*[-\s\/,]*(\d{2,4})$/.exec(raw))){ const mo=MON[m[2].toLowerCase()]; if(!mo) return undefined; const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(mo)}-${pad(+m[1])}`; }
  return undefined;
}
function parseMonth(raw){
  raw=String(raw).trim(); let m;
  if((m=/^(\d{4})[-\/](\d{1,2})$/.exec(raw))) return `${m[1]}-${pad(+m[2])}`;
  if((m=/^(\d{1,2})[-\/](\d{4})$/.exec(raw))) return `${m[2]}-${pad(+m[1])}`;
  if((m=/^([A-Za-z]{3,4})[A-Za-z]*[-\s\/,']*(\d{2,4})$/.exec(raw))){ const mo=MON[m[1].toLowerCase()]; if(!mo) return undefined; return `${m[2].length===2?'20'+m[2]:m[2]}-${pad(mo)}`; }
  const d=parseDate(raw); return d? d.slice(0,7) : undefined;
}
function parseCell(c,raw,row){
  switch(c.type){
    case 'number': { const n=parseFloat(String(raw).replace(/[,₹\s]/g,'').replace(/^\((.*)\)$/,'-$1')); return isNaN(n)?undefined:n; }
    case 'date': return parseDate(raw);
    case 'month': return parseMonth(raw);
    case 'select': return c.options.find(o=>norm(o)===norm(raw)) || c.options.find(o=>norm(o).startsWith(norm(raw))&&norm(raw).length>=3);
    case 'system': return byName(c.filter?state.systems.filter(c.filter):state.systems,'name',raw);
    case 'area': return byName(state.areas,'name',raw);
    case 'cons': return byName(state.consItems,'item',raw);
    case 'machine': return byName(state.machines,'name',raw);
    case 'owneditem': return byName(state.owned.filter(o=>!row.systemId||o.systemId===row.systemId),'item',raw);
    case 'storeitem': return byName(state.storeItems,'item',raw);
    case 'rentitem': return byName(rentStoreItems(),'item',raw);
    case 'contractor': return byName(state.contractors,'name',raw);
    case 'itemsel': { const its=state.items.filter(i=>i.systemId===row.systemId); const r=norm(raw); const x=its.find(i=>norm(i.code)===r)||its.find(i=>norm(i.item)===r)||its.find(i=>norm((i.code?i.code+' – ':'')+i.item)===r); return x?x.id:undefined; }
    default: return String(raw);
  }
}
function pastePanel(arr){
  const cols=(PCOLS[arr]||[]).filter(c=>!c.calc), msg=(state.ui.pasteMsg||{})[arr];
  return `<details class="paste noprint" ${msg?'open':''}><summary>Paste rows from Excel</summary>
   <p class="note">In Excel, arrange columns in this order: <b>${cols.map(c=>esc(stripTags(c.label))).join(' · ')}</b>. Select the rows, press Ctrl+C, click in the box and press Ctrl+V. A heading row is skipped automatically. Dates like 24-10-2026, 24/10/26 or 24-Oct-2026 all work; names are matched to your lists.</p>
   <textarea id="pb-${arr}" rows="4" placeholder="Paste here (Ctrl+V)"></textarea>
   <div class="acts"><button class="btn p sm" onclick="doPaste('${arr}')">Add pasted rows</button></div>
   ${msg?`<div class="pmsg">${msg}</div>`:''}</details>`;
}
function doPaste(arr){
  const box=document.getElementById('pb-'+arr), txt=(box&&box.value||'').replace(/\r/g,'');
  const cols=(PCOLS[arr]||[]).filter(c=>!c.calc);
  const lines=txt.split('\n').filter(l=>l.trim()); if(!lines.length){ toast('Paste the Excel rows into the box first.'); return; }
  let added=0; const errs=[], newRows=[];
  lines.forEach((line,li)=>{
    const cells=line.split('\t');
    if(li===0 && cells.some((v,i)=>cols[i]&&norm(v)===norm(stripTags(cols[i].label)))) return;
    const row=Object.assign({id:uid()},DEFAULTS[arr](),PPRESET[arr]?PPRESET[arr]():{}); let bad=null;
    cols.forEach((c,i)=>{ if(bad) return; const raw=(cells[i]??'').trim(); if(raw==='') return; const v=parseCell(c,raw,row); if(v===undefined) bad=`Line ${li+1}: "${esc(raw)}" not recognised as ${esc(stripTags(c.label))}`; else row[c.key]=v; });
    if(bad) errs.push(bad); else { newRows.push(row); added++; }
  });
  newRows.forEach(r=>r._u=nowMs()); state[RA(arr)].push(...newRows);
  state.ui.pasteMsg=state.ui.pasteMsg||{};
  state.ui.pasteMsg[arr]=`<b>${added} row${added===1?'':'s'} added.</b>${errs.length?` ${errs.length} skipped:<br>`+errs.slice(0,8).join('<br>')+(errs.length>8?'<br>…':'')+'<br>Fix those lines in Excel and paste them again.':''}`;
  save(); toast(`${added} row${added===1?'':'s'} added${errs.length?', '+errs.length+' skipped':''}.`);
}

function chunkArray(arr){ const out=[]; let cur=[],size=2; for(const r of arr){ const s=JSON.stringify(r).length+1; if(cur.length&&size+s>180000){ out.push(cur); cur=[]; size=2; } cur.push(r); size+=s; } out.push(cur); return out; }
async function pushRemote(){
  if(!SYNC.db) return; if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; setSync('saving');
  try{
    const small={}, chunks={};
    for(const k of Object.keys(state)){
      if(k==='pending'||k==='firstRun') continue;
      if(Array.isArray(state[k])){
        const cs=chunkArray(state[k]); chunks[k]=cs.length;
        for(let i=0;i<cs.length;i++){ const id=k+'~'+i, js=JSON.stringify(cs[i]); if(SYNC.written[id]===js) continue; await SYNC.db.doc(syncCol()+'/'+id).set({rows:cs[i]}); SYNC.written[id]=js; }
        for(let i=cs.length;i<(SYNC.chunks[k]||0);i++){ await SYNC.db.doc(syncCol()+'/'+k+'~'+i).delete(); delete SYNC.written[k+'~'+i]; }
      } else small[k]=state[k];
    }
    await SYNC.db.doc(syncCol()+'/_meta').set({rev:state.rev||0,savedAt:new Date().toISOString(),chunks,small:JSON.parse(JSON.stringify(small))});

    console.warn('sync failed',e); setSync('error');
    if(e&&e.code==='quota_exceeded') toast('Online storage is full. Download Excel and a backup, then ask for help to archive old data.');

}
async function pullRemote(m){
  const snap=await SYNC.db.collection(syncCol()).get(); const docs={}; snap.docs.forEach(d=>{ docs[d.id]=d.data(); });

  for(const [k,n] of Object.entries(m.chunks||{})){ let rows=[]; for(let i=0;i<n;i++){ const d=docs[k+'~'+i]; const r=d&&Array.isArray(d.rows)?d.rows:[]; rows=rows.concat(r); SYNC.written[k+'~'+i]=JSON.stringify(r); } next[k]=rows; }

  state=hydrate(next); state.ui=Object.assign(state.ui,ui); state.route=route; state.rev=m.rev||0; state.meta.pid=PRJ.cur; state.pending=false;
  SYNC.chunks=m.chunks||{}; SYNC.last=new Date().toTimeString().slice(0,5);
  clearCaches(); persistLocal(); render(); setSync('saved');
}
async function initSync(){
  if(!(window.claude && typeof window.claude.use==='function')){ setSync('local'); return; }

async function syncAttach(){

function exportState(){
  const out={}; Object.keys(state).forEach(k=>{ if(['ui','route','pending','firstRun','pwaFresh'].includes(k)) return; out[k]=state[k]; });
  return {format:'formtrack',version:1,savedAt:new Date().toISOString(),savedBy:navigator.userAgent.slice(0,60),state:out};
}
function mergeState(raw){
  const inc0 = raw && raw.format==='formtrack' ? raw.state : raw;
  if(!inc0 || !Array.isArray(inc0.systems)) throw new Error('not a FormTrack file');
  const I=hydrate(JSON.parse(JSON.stringify(inc0)));
  let added=0, updated=0, removed=0;
  const del=Object.assign({},state.deleted||{}); Object.entries(I.deleted||{}).forEach(([id,t])=>{ del[id]=Math.max(del[id]||0,t); });
  const keys=new Set([...Object.keys(state),...Object.keys(I)]);
  keys.forEach(k=>{
    if(!Array.isArray(I[k]) && !Array.isArray(state[k])) return;
    const mine=Array.isArray(state[k])?state[k]:[], theirs=Array.isArray(I[k])?I[k]:[];
    const map=new Map(mine.map(r=>[r.id,r]));
    theirs.forEach(r=>{ if(!r||!r.id) return; const m=map.get(r.id); if(!m){ if(!(del[r.id] && del[r.id]>=(r._u||0))){ map.set(r.id,r); added++; } } else if((r._u||0)>(m._u||0)){ map.set(r.id,r); updated++; } });
    const before=map.size; const list=[...map.values()].filter(r=>!(r&&r.id&&del[r.id]&&del[r.id]>=(r._u||0)));
    removed+=before-list.length; state[k]=list;
  });
  const mu=state.meta._u||{}, iu=I.meta._u||{};
  Object.keys(I.meta).forEach(k=>{ if(k==='_u') return; if((iu[k]||0)>(mu[k]||0)){ state.meta[k]=I.meta[k]; mu[k]=iu[k]; } });
  state.meta._u=mu;
  if((I.meeting&&I.meeting._u||0)>(state.meeting._u||0)){ const keepLocks=state.meeting.locks; state.meeting=I.meeting; const ids=new Set(state.meeting.locks.map(L=>L.id)); keepLocks.forEach(L=>{ if(!ids.has(L.id)) state.meeting.locks.push(L); }); }
  else { const ids=new Set(state.meeting.locks.map(L=>L.id)); (I.meeting.locks||[]).forEach(L=>{ if(!ids.has(L.id)) state.meeting.locks.push(L); }); }
  state.deleted=del; clearCaches();
  return {added,updated,removed,text: (added||updated||removed)? `Merged from file: ${added} new, ${updated} updated${removed?`, ${removed} removed`:''}. Your own entries were kept.` : 'Already up to date – nothing new in the file.'};
}

async function fsWrite(){

  const old=document.getElementById('cfm'); if(old) old.remove();
  if(pid===PRJ.cur){ return; }
  prjSync(); persistLocal();
  const p=PRJ.list.find(x=>x.id===pid);
  const ui=state.ui;
  state=readProject(pid)||newProjectState(pid,p&&p.name,p&&p.company);
  state.meta.pid=pid; state.ui.sideMini=ui.sideMini; state.ui.fileDirty=ui.fileDirty; state.ui.fileSaved=ui.fileSaved; state.ui.fileOpened=ui.fileOpened; state.ui.fileSeen=ui.fileSeen;
  state.route='dashboard'; PRJ.cur=pid; clearCaches(); persistLocal(); prjSync(); applyTheme(); render();
  if(SYNC.db) syncAttach();
  if(!quiet) toast('Opened project: '+state.meta.project);
}
function openProjects(){
  prjSync();
  const old=document.getElementById('cfm'); if(old) old.remove();
  const d=document.createElement('div'); d.id='cfm'; d.className='cfm';
  const list=[...PRJ.list].sort((a,b)=>(a.id===PRJ.cur?-1:b.id===PRJ.cur?1:(a.name||'').localeCompare(b.name||'')));
  d.innerHTML=`<div class="cfm-box wide" role="dialog" aria-modal="true" aria-label="Projects"><p><b>Projects</b><br><span style="color:var(--muted);font-size:13px">Each project keeps its own data. Tap one to open it.</span></p>
  <div class="prjlist">${list.map(p=>`<button class="prjrow ${p.id===PRJ.cur?'on':''}" onclick="switchProject('${p.id}')"><span class="pi">${esc((p.name||'P').trim().charAt(0).toUpperCase())}</span><span class="pn"><b>${esc(p.name||'Project')}</b><small>${p.company?esc(p.company)+' · ':''}${p.pct==null?'scope not entered':p.pct+'% of scope done'}</small></span>${p.id===PRJ.cur?'<span class="pill ok">OPEN</span>':''}</button>`).join('')}</div>
  <div class="prjnew"><input id="prjName" placeholder="New project name, e.g. DLF Bay View" aria-label="New project name"><button class="btn p" id="prjAdd">+ Add project</button></div>
  <div class="acts"><button class="btn" id="cfmNo">Close</button></div></div>`;
  d.querySelector('#cfmNo').onclick=()=>d.remove(); d.onclick=e=>{ if(e.target===d) d.remove(); };
  const inp=d.querySelector('#prjName'); const add=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } addProject(v); };
  d.querySelector('#prjAdd').onclick=add; inp.onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.body.appendChild(d);
}
function addProject(name){
  if(PRJ.list.some(p=>norm(p.name)===norm(name))){ toast('A project with this name already exists.'); return; }
  const pid=newPid(), company=state.meta.company||'';
  prjSync(); persistLocal();
  const s=newProjectState(pid,name,company);
  try{ stWrite(pid,s); }catch(e){}
  PRJ.list.push({id:pid,name,company,pct:null}); prjSave();
  switchProject(pid,true); toast('New project created: '+name+'. Set up its systems and areas first.'); go('setup');
}
function removeProject(pid){
  const p=PRJ.list.find(x=>x.id===pid); if(!p) return;
  if(PRJ.list.length<2){ toast('This is your only project.'); return; }
  askConfirm(`Remove "${p.name}" and all its data from THIS device? Other devices keep their copy. Save a storage file first if you may need it.`,()=>{
    if(pid===PRJ.cur){ const nxt=PRJ.list.find(x=>x.id!==pid); switchProject(nxt.id,true); }
    PRJ.list=PRJ.list.filter(x=>x.id!==pid); prjSave(); try{ localStorage.removeItem(pkey(pid)); }catch(e){}
    if(SYNC.db) prjPushRemote(true,pid); render(); toast('Project removed from this device.');
  },'Remove project');
}

function stripState(s){ const out={}; Object.keys(s).forEach(k=>{ if(['ui','route','pending','firstRun','pwaFresh'].includes(k)) return; out[k]=s[k]; }); return out; }
function exportAll(){
  prjSync(); persistLocal();
  const projects=PRJ.list.map(p=>{ const st= p.id===PRJ.cur? state : readProject(p.id); return st?{id:p.id,name:p.name,company:p.company,state:stripState(st)}:null; }).filter(Boolean);
  const used=new Set(); projects.forEach(P=>(P.state.practices||[]).forEach(r=>(r.photos||[]).forEach(id=>used.add(id))));
  const photos={}; used.forEach(id=>{ if(PH[id]) photos[id]=PH[id]; });
  return {format:'formtrack',version:2,savedAt:new Date().toISOString(),savedBy:navigator.userAgent.slice(0,60),current:PRJ.cur,projects,photos};
}
function mergeInto(pid,inc,P){
  if(pid===PRJ.cur){ const r=mergeState(inc); state.meta.pid=pid; return r; }
  const saved=state; const ex=readProject(pid); let r;
  state= ex || newProjectState(pid,P&&P.name,P&&P.company);
  try{ r=mergeState(inc); state.meta.pid=pid; stWrite(pid,state);
    let p=PRJ.list.find(x=>x.id===pid); if(!p){ p={id:pid}; PRJ.list.push(p); } p.name=state.meta.project; p.company=state.meta.company||''; p.pct=prjPct(state);
  } finally { state=saved; clearCaches(); }
  r.isNew=!ex; return r;
}
function mergeFile(raw){
  if(raw&&raw.format==='formtrack'&&Array.isArray(raw.projects)){
    let a=0,u=0,rm=0; const newNames=[];
    if(raw.photos&&typeof raw.photos==='object') Object.entries(raw.photos).forEach(([id,d])=>{ if(!PH[id]&&typeof d==='string'&&d.startsWith('data:image/')) phPut(id,d); });
    raw.projects.forEach(P=>{ if(!P||!P.id||!P.state) return; const r=mergeInto(P.id,P.state,P); a+=r.added; u+=r.updated; rm+=r.removed; if(r.isNew) newNames.push(P.name||'project'); });
    prjSync(); clearCaches();
    const txt=(a||u||rm||newNames.length)? `Merged from file: ${a} new, ${u} updated${rm?`, ${rm} removed`:''}${newNames.length?` · new project${newNames.length>1?'s':''}: ${newNames.join(', ')}`:''}. Your own entries were kept.` : 'Already up to date – nothing new in the file.';
    return {added:a,updated:u,removed:rm,text:txt};
  }
  const r=mergeState(raw); prjSync(); return r; /* older single-project file → current project */
}

const syncCol=()=>PRJ.cur===MAIN_PID?'ct':'ct_'+PRJ.cur.replace(/[^a-z0-9]/gi,'');
let PRJ_REMOTE_T=null;
function prjPushRemote(now,removedPid){
  if(!SYNC.db) return; clearTimeout(PRJ_REMOTE_T);
  const go_=async()=>{ try{ const ref=SYNC.db.doc('ct/_projects'); const s=await ref.get(); const rem=s.exists?(s.data().removed||{}):{}; if(removedPid) rem[removedPid]=nowMs();
    const list=PRJ.list.map(p=>({id:p.id,name:p.name,company:p.company||'',pct:p.pct==null?null:p.pct}));
    const other=s.exists?(s.data().list||[]):[]; other.forEach(o=>{ if(!list.find(x=>x.id===o.id)&&!rem[o.id]&&o.id!==removedPid) list.push(o); });
    await ref.set({list,removed:rem}); }catch(e){} };
  if(now) go_(); else PRJ_REMOTE_T=setTimeout(go_,1500);
}
async function prjPullRemote(){
  try{ const s=await SYNC.db.doc('ct/_projects').get(); if(!s.exists) return; const d=s.data(), rem=d.removed||{};
    (d.list||[]).forEach(o=>{ if(rem[o.id]) return; const p=PRJ.list.find(x=>x.id===o.id); if(!p) PRJ.list.push(o); else if(o.id!==PRJ.cur){ p.name=o.name; p.company=o.company; p.pct=o.pct; } });
    PRJ.list=PRJ.list.filter(p=>!rem[p.id]||p.id===PRJ.cur); prjSave(); }catch(e){}
}

async function download(filename,text,type){ /* text may be a string or an ArrayBuffer */
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){ try{ await dl.save({filename,data:text}); toast('Saved: '+filename); }catch(e){ if(!e||e.code!=='declined') toast('Could not save the file here ('+((e&&e.code)||'error')+'). Open the HTML file on your device to export.'); } return; }
      if(EMBED){ toast('Saving files is not available in this view. Open the HTML file on your device to export.'); return; }
    }
  }catch(e){}
  const blob=new Blob([text],{type:type||'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function downloadBackup(){ state.meta.lastBackup=todayStr(); persist(); download(`FormTrack-backup-${slug(state.meta.project)}-${todayStr()}.json`,JSON.stringify(state,null,1),'application/json'); render(); toast('Backup downloaded.'); }
function restoreBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{ let p0; try{ p0=JSON.parse(rd.result); }catch(e){ toast('This file could not be read – it may not have downloaded fully. Download it again and retry.'); return; } try{ const p=p0; if(p&&p.format==='formtrack'){ const r=mergeFile(p); state.pwaFresh=false; save(); toast(r.text); return; } if(!p||!Array.isArray(p.systems)) throw 0; askConfirm('Replace all current data with this backup?',()=>{ state=hydrate(p); state.meta.pid=PRJ.cur; save(); prjSync(); toast('Backup restored.'); },'Restore'); }catch(e){ toast('This is not a valid FormTrack backup.'); } };
  rd.readAsText(file);
}

/* ================= ASK – type a question, get the answer from your own data (offline, no internet) ================= */
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function askMonth(q){ const t=thisMonth(); if(/\blast month|previous month|prev month/.test(q)) return mAdd(t,-1); if(/\bthis month|current month/.test(q)) return t;
  for(let k=0;k<12;k++){ const re=new RegExp('\\b'+MONTHS[k]+'[a-z]*\\b'); if(re.test(q)){ const y=(q.match(/\b(20\d\d)\b/)||[])[1]; let ym=(y||t.slice(0,4))+'-'+String(k+1).padStart(2,'0'); if(!y&&ym>t) ym=(+t.slice(0,4)-1)+'-'+String(k+1).padStart(2,'0'); return ym; } }
  return null; }
const askNorm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function askFind(q,list,name){ const Q=' '+askNorm(q)+' '; return list.filter(x=>{ const n=askNorm(name(x)); return n&&(Q.includes(' '+n+' ')||n.split(' ').filter(w=>w.length>3).some(w=>Q.includes(' '+w+' '))); }); }
const askLine=(l,v,sub)=>`<div class="aline"><span>${l}</span><b>${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
const askGo=(r,l)=>`<button class="btn sm" onclick="closeAsk();go('${r}')">Open ${l} ›</button>`;
function askAnswer(raw){ const q=askNorm(raw); if(!q) return '';
  const m=askMonth(q), todate=/till now|to date|total|so far|overall|from start/.test(q)&&!m, mm=m||thisMonth();
  const sys=askFind(q,state.systems,x=>x.name), area=askFind(q,state.areas,x=>x.name);
  const sysL=sys.length?sys:rentalSystems(), lbl=todate?'till now':monthLabel(mm);
  const months=todate?allMonthsUpTo(thisMonth()):[mm];
  const out=[];
  /* rent */
  if(/\brent\b|\bbill|\brent /.test(q)&&!/excess|on site|left to return/.test(q)){ let tot=0; const rows=sysL.filter(x=>x.ownership==='Rental').map(x=>{ const r=months.reduce((a,mo)=>a+systemMonthRent(x.id,mo).rent,0); tot+=r; return askLine(esc(x.name),money(r)); });
    out.push(`<h4>Rent – ${lbl}</h4>${rows.join('')}${rows.length>1?askLine('<b>Total</b>',money(tot)):''}${askGo('rent','Rent Calculation')}`); }
  if(/excess/.test(q)){ let tot=0; const rows=sysL.filter(x=>x.ownership==='Rental').map(x=>{ const r=months.reduce((a,mo)=>a+systemMonthRent(x.id,mo).excess,0); tot+=r; return r?askLine(esc(x.name),`<span class="neg">${money(r)}</span>`):''; }).filter(Boolean);
    out.push(`<h4>Excess rent – ${lbl}</h4>${rows.join('')||'<p>No excess rent.</p>'}${rows.length>1?askLine('<b>Total</b>',money(tot)):''}`); }
  /* executed / progress */
  if(/execut|done|progress|complet|sqm done|work done/.test(q)){ const ex=state.execution.filter(e=>(todate||months.includes(monthOf(e.date)))&&(!sys.length||sys.some(x=>x.id===e.systemId))&&(!area.length||area.some(a=>a.id===e.areaId)));
    const by=new Map(); ex.forEach(e=>{ const k=sysName(e.systemId)+(area.length?' › '+areaName(e.areaId):''); by.set(k,(by.get(k)||0)+num(e.sqm)); });
    out.push(`<h4>Executed – ${lbl}</h4>${[...by].map(([k,v])=>askLine(esc(k),fmtN(v)+' sqm')).join('')||'<p>No execution entered.</p>'}${by.size>1?askLine('<b>Total</b>',fmtN(sumSqm(ex))+' sqm'):''}${askGo('execution','Execution')}`); }

};
function render(){
  applyTheme();
  if(!PAGES[state.route]||!NAV.some(g=>g.items.some(([k])=>k===state.route))) state.route='dashboard';
  const side=document.getElementById('side');
  side.className=state.ui.sideMini?'mini':''; side.innerHTML=sideHTML();
  updateElementList();
  const main=document.getElementById('main'), st=main.scrollTop;
  const title=NAV.flatMap(g=>g.items).find(([k])=>k===state.route);
  let body;
  try{ body=PAGES[state.route](); }catch(e){ console.error(e); body=`<div class="banner">${PILL('bd','ERROR')} This page could not be shown: ${esc(e.message)}. Your data is safe — download a backup from "Backup & Settings".</div>`; }
  main.innerHTML=`<div class="mh"><div><button class="company edit ${state.meta.company?'':'empty'}" onclick="editName('company',this)" title="Click to edit company name">${state.meta.company?esc(state.meta.company):'+ Add company name'}</button><button class="projname edit" onclick="editName('project',this)" title="Click to edit project name">${esc(state.meta.project)}</button><button class="prjsw" onclick="openProjects()" title="Switch project or add a new one">⇅ Projects${PRJ.list.length>1?` (${PRJ.list.length})`:''}</button><h1>${title[1]}${state.meta.location?`<span class="loc">${esc(state.meta.location)}</span>`:''}</h1></div><div class="acts noprint">${syncLight()}<button class="btn sm" onclick="openThemes()">🎨 Colours</button><button class="btn sm" onclick="exportExcel()">⬇ Excel</button><button class="btn sm" onclick="downloadBackup()">Backup</button>${EMBED?'':'<button class="btn sm" onclick="window.print()">Print</button>'}</div></div>`+(hasDemo()&&state.route!=='help'?`<div class="banner demo">${PILL('wn','PRACTICE DATA')} <span>Scope, execution, labour, targets, consumables, store entries, contractors and PRs marked PRACTICE are sample data. Vendor material data is real.</span><button class="btn sm d" onclick="removeDemoData()">Remove practice data</button></div>`:'')+body;
  main.scrollTop=st;
  if(!document.getElementById('askb')){ const b=document.createElement('button'); b.id='askb'; b.className='askb'; b.innerHTML='💬 Ask'; b.title='Ask a question about your data'; b.onclick=openAsk; document.body.appendChild(b); }
  if(!document.getElementById('qkb')){ const b=document.createElement('button'); b.id='qkb'; b.className='askb qkb'; b.innerHTML='⚡ Quick'; b.title='Quick Entry – execution, labour, challan, store issue'; b.onclick=()=>{ closeAsk(); go('quick'); }; document.body.appendChild(b); }
}
load();
/* the device database may hold a newer copy (e.g. when localStorage was full) */
(async()=>{ if(!HAS_IDB) return; try{ const db=await idbOpen(); await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').openCursor(); q.onsuccess=()=>{ const c=q.result; if(!c) return res(); if(String(c.key).startsWith('state:')) IDBC[String(c.key).slice(6)]=c.value; c.continue(); }; q.onerror=()=>res(); });
    const j=IDBC[PRJ.cur]; if(j){ const p=JSON.parse(j); if(num(p.savedAt)>num(state.savedAt)){ const r=state.route, ui=state.ui; state=hydrate(p); state.meta.pid=PRJ.cur; state.route=r||state.route; render(); } }
    else if(state&&state.meta) idbQueue(PRJ.cur,stJSON(state));
  }catch(e){} try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){} })();
phLoad().then(()=>{ if(['practice'].includes(state.route)) render(); }); prjSync(); if(state.firstRun){ delete state.firstRun; if(!FILEMODE) loadDemoData(true); state.route='dashboard'; state.pending=true; persistLocal(); } render(); initSync(); fsInit();

</script>
</body>
</html>
