<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link closed</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#15232d;color:#e8eef2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.b{max-width:360px;text-align:center;background:#1f3140;border:1px solid #2e4558;border-radius:16px;padding:28px 22px}
.l{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;background:linear-gradient(160deg,#0e6b8c,#e0a526)}
h1{font-size:20px;margin:0 0 8px}p{color:#a9bccb;font-size:14.5px;line-height:1.5;margin:0}</style></head>
<body><div class="b"><div class="l">F</div><h1>This link is closed</h1><p>This app is no longer available here.<br>Contact the owner of this app.</p></div>
<script>
/* remove the old offline copy so the closed app cannot open from the phone's cache.
   Saved data on the device is NOT touched. */
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(location.pathname.startsWith(new URL(r.scope).pathname)) r.unregister(); })).catch(()=>{}); }
if(window.caches){ caches.keys().then(ks=>ks.forEach(k=>{ if(/^formtrack-/.test(k)) caches.open(k).then(c=>c.keys().then(rq=>rq.forEach(q=>{ if(new URL(q.url).pathname.startsWith(location.pathname.replace(/index\.html$/,''))) c.delete(q); }))); })).catch(()=>{}); }
</script></body></html>
